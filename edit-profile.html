<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
        }

        .profile-page {

            max-width: 550px;
            margin: 50px auto;
            padding: 30px;
        }

        .profile-header {

            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header h1 {

            font-size: 30px;
            margin-bottom: 10px;
        }

        .profile-box {

            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-box label {

            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .profile-box input {

            width: 100%;
            padding: 10px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .save-button {

            width: 100%;
            padding: 8px;
            margin-top: 30px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

       .back-button {
    width: 170px;
    display: block;
    text-align: center;
    margin: 30px 0 0 0;
    padding: 5px;
    background: #38221e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
}

    </style>

</head>


<body>

    <div class="profile-page">

        <div class="profile-header">

            <h1>
                ✏️ Edit Profile
            </h1>

            <p>
                Update your customer information.
            </p>

        </div>


        <div class="profile-box">

            <!-- FULL NAME -->

            <label for="profile-name">
                Full Name
            </label>

            <input
                type="text"
                id="profile-name"
                placeholder="Enter your name"
            >


            <!-- PHONE -->

            <label for="profile-phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="profile-phone"
                placeholder="Enter your phone number"
            >


            <!-- ADDRESS -->

            <label for="profile-address">
                Address
            </label>

            <input
                type="text"
                id="profile-address"
                placeholder="Enter your address"
            >


            <!-- EMAIL -->

            <label for="profile-email">
                Email
            </label>

            <input
                type="email"
                id="profile-email"
                placeholder="Your email"
                readonly
            >


            <!-- SAVE -->

            <button
                type="button"
                class="save-button"
                onclick="saveCustomerProfilePage()"
            >
                Save Changes
            </button>


            <!-- BACK -->

            <a
                href="my-account.html"
                class="back-button"
            >
                ← Back to My Account
            </a>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // LOAD CUSTOMER PROFILE
        // ==========================================

        async function loadCustomerProfilePage() {


            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session error:",
                    error
                );

                return;
            }


            const session =
                data.session;


            // USER NOT LOGGED IN

            if (!session) {

                alert(
                    "Please login to edit your profile."
                );

                window.location.href =
                    "index.html";

                return;
            }


            const user =
                session.user;


            // EMAIL FROM AUTH

            document.getElementById(
                "profile-email"
            ).value =
                user.email || "";


            // GET PROFILE FROM SUPABASE

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "id, full_name, phone, address"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (profileError) {

                console.error(
                    "Profile fetch error:",
                    profileError
                );

                alert(
                    "Could not load your profile.\n\n" +
                    profileError.message
                );

                return;
            }


            // PROFILE FOUND

            if (profile) {

                document.getElementById(
                    "profile-name"
                ).value =
                    profile.full_name || "";


                document.getElementById(
                    "profile-phone"
                ).value =
                    profile.phone || "";


                document.getElementById(
                    "profile-address"
                ).value =
                    profile.address || "";

            }

        }


        // ==========================================
        // SAVE CUSTOMER PROFILE
        // ==========================================

        async function saveCustomerProfilePage() {


            const name =
                document.getElementById(
                    "profile-name"
                ).value.trim();


            const phone =
                document.getElementById(
                    "profile-phone"
                ).value.trim();


            const address =
                document.getElementById(
                    "profile-address"
                ).value.trim();


            // NAME REQUIRED

            if (!name) {

                alert(
                    "Please enter your name."
                );

                return;
            }


            // CHECK LOGIN

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (
                sessionError ||
                !sessionData.session
            ) {

                alert(
                    "Please login first."
                );

                return;
            }


            const user =
                sessionData.session.user;


            // UPDATE PROFILES TABLE

            const {
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .update({

                        full_name: name,

                        phone: phone,

                        address: address

                    })
                    .eq(
                        "id",
                        user.id
                    );


            if (error) {

                console.error(
                    "Profile update error:",
                    error
                );

                alert(
                    "Could not update your profile.\n\n" +
                    error.message
                );

                return;
            }


            // UPDATE AUTH NAME TOO

            const {
                error: authError
            } =
                await supabaseClient.auth.updateUser({

                    data: {

                        full_name: name

                    }

                });


            if (authError) {

                console.error(
                    "Auth profile update error:",
                    authError
                );

            }


            alert(
                "✨ Profile updated successfully!"
            );


            // GO BACK TO ACCOUNT

            window.location.href =
                "my-account.html";

        }


        // ==========================================
        // START
        // ==========================================

        loadCustomerProfilePage();

    </script>

</body>

</html>

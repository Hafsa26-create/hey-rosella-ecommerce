<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Your Order - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            color: #3e2723;
        }

        .tracking-page {

            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
        }

        .tracking-header {

            text-align: center;
            margin-bottom: 30px;
        }

        .tracking-header h1 {

            font-size: 32px;
            margin-bottom: 10px;
        }

        .tracking-header p {

            color: #555;
        }

        .tracking-box {

            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .tracking-input {

            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tracking-input input {

            flex: 1;
            padding: 12px;
            border: 1px solid #d4af37;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .tracking-input button {

            padding: 12px 20px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .order-details {

            display: none;
            margin-top: 20px;
        }

        .order-details h2 {

            margin-bottom: 15px;
        }

        .status-step {

            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .status-step.completed {

            background: #eadfbd;
            font-weight: bold;
        }

        .back-button {

            display: inline-block;
            margin-top: 25px;
            padding: 11px 20px;
            background: #3e2723;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 600px) {

            .tracking-page {
                margin: 20px auto;
                padding: 15px;
            }

            .tracking-input {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="tracking-page">

        <div class="tracking-header">

            <h1>
                🚚 Track Your Order
            </h1>

            <p>
                Enter your Order ID to check your order status.
            </p>

        </div>


        <div class="tracking-box">

            <div class="tracking-input">

                <input
                    type="text"
                    id="order-id-input"
                    placeholder="Enter Order ID"
                >

                <button
                    type="button"
                    onclick="trackOrder()"
                >
                    Track Order
                </button>

            </div>


            <!-- ORDER DETAILS -->

            <div
                id="order-details"
                class="order-details"
            >

                <h2>
                    Order #<span id="display-order-id"></span>
                </h2>

                <p>
                    Product:
                    <strong>Elegant Necklace</strong>
                </p>

                <p>
                    Total:
                    <strong>850 BDT</strong>
                </p>


                <div class="status-step completed">
                    ✓ Order Placed
                </div>

                <div class="status-step completed">
                    ✓ Order Confirmed
                </div>

                <div class="status-step completed">
                    ✓ Processing
                </div>

                <div class="status-step completed">
                    🚚 Shipped
                </div>

                <div class="status-step">
                    ○ Delivered
                </div>

            </div>


            <a
                href="my-orders.html"
                class="back-button"
            >
                ← Back to My Orders
            </a>

        </div>

    </div>


    <script>

        function trackOrder() {

            const orderId =
                document.getElementById(
                    "order-id-input"
                ).value.trim();


            if (!orderId) {

                alert(
                    "Please enter your Order ID."
                );

                return;
            }


            document.getElementById(
                "display-order-id"
            ).textContent = orderId;


            document.getElementById(
                "order-details"
            ).style.display = "block";

        }

    </script>

</body>

</html>

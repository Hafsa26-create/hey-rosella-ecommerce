<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products - Hey Rosella</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff0f5;color:#3e2723}.admin-header{background:#3e2723;color:white;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.admin-logo{font-size:24px;font-weight:bold}.admin-badge{background:#d4af37;padding:7px 12px;border-radius:20px;font-size:13px}.products-page{max-width:1100px;margin:40px auto;padding:0 25px}.page-header{margin-bottom:25px}.page-header h1{margin-bottom:8px}.page-header p{color:#6d5550}.product-form,.products-section{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:30px}.product-form h2,.products-section h2{margin-top:0}.form-group{margin-top:15px}.form-group label{display:block;margin-bottom:6px;font-weight:bold}.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;font-size:14px}.form-group textarea{min-height:90px;resize:vertical}.button{padding:11px 18px;border:none;border-radius:6px;cursor:pointer;font-size:14px}.gold-button{background:#d4af37;color:white}.brown-button{background:#3e2723;color:white}.gray-button{background:#eee;color:#3e2723}.form-button{width:100%;margin-top:20px}.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.admin-product-card{background:#fff8fa;border:1px solid #f0dfe5;border-radius:10px;padding:15px}.product-image{height:180px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;margin-bottom:15px;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover}.admin-product-card h3{margin:5px 0}.product-price{font-weight:bold;color:#d4af37;margin-bottom:5px}.product-category{font-size:13px;color:#6d5550;margin-bottom:15px}.product-actions{display:flex;gap:8px}.product-actions button{flex:1}.status-badge{display:inline-block;margin:8px 0;padding:5px 9px;border-radius:15px;font-size:12px}.active-status{background:#dff5e3;color:#176b2c}.inactive-status{background:#eee;color:#666}.back-button{display:block;width:250px;margin:30px auto;padding:12px;background:#3e2723;color:white;text-align:center;text-decoration:none;border-radius:6px}@media(max-width:800px){.products-grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.admin-header{padding:15px}.admin-logo{font-size:19px}.products-page{padding:0 15px}.products-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="admin-header"><div class="admin-logo">Hey Rosella 💎</div><div class="admin-badge">ADMIN</div></header>
<main class="products-page">
<div class="page-header"><h1>🛍️ Product Management</h1><p>Add and manage your Hey Rosella products.</p></div>
<section class="product-form">
<h2 id="form-title">➕ Add New Product</h2>
<div class="form-group"><label for="product-name">Product Name</label><input type="text" id="product-name" placeholder="Example: Pearl Necklace"></div>
<div class="form-group"><label for="product-price">Price (BDT)</label><input type="number" id="product-price" placeholder="850" min="0"></div>
<div class="form-group"><label for="product-category">Category</label><select id="product-category"><option value="">Select Category</option><option value="Earrings">Earrings</option><option value="Jhumka">Jhumka</option><option value="Chhoto Jhumka">Chhoto Jhumka</option><option value="Kashmiri Jhumka">Kashmiri Jhumka</option><option value="Pendant">Pendant</option><option value="Rings">Rings</option><option value="Necklace">Necklace</option><option value="Bracelet">Bracelet</option></select></div>
<div class="form-group"><label for="product-description">Product Description</label><textarea id="product-description" placeholder="Write a short product description..."></textarea></div>
<div class="form-group"><label for="product-image-url">Product Image URL (optional)</label><input type="url" id="product-image-url" placeholder="https://example.com/product.jpg"></div>
<button type="button" id="form-button" class="button gold-button form-button" onclick="saveProduct()">➕ Add Product</button>
<button type="button" id="cancel-button" class="button gray-button form-button" onclick="clearProductForm()" style="display:none">Cancel Edit</button>
</section>
<section class="products-section"><h2>📋 Current Products</h2><div id="admin-products-grid" class="products-grid"><p style="grid-column:1/-1;text-align:center;padding:30px;color:#6d5550">Loading products...</p></div></section>
<a href="admin.html" class="back-button">← Back to Admin Dashboard</a>
</main>
<script>
const SUPABASE_URL="https://aktxgvbzmuuatwpimcyz.supabase.co";
const SUPABASE_KEY="sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let editingProductId=null;

function esc(value){return String(value??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

async function checkAdmin(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error||!data.session){alert("Please login as admin first.");window.location.href="admin-login.html";return false;}
 const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("role").eq("id",data.session.user.id).single();
 if(profileError||!profile||profile.role!=="Admin"){alert("Admin access required.");await supabaseClient.auth.signOut();window.location.href="admin-login.html";return false;}
 return true;
}

async function loadProducts(){
 const container=document.getElementById("admin-products-grid");
 container.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:30px;color:#6d5550">Loading products...</p>';
 const {data,error}=await supabaseClient.from("products").select("id,name,price,category,description,image_url,is_active,created_at,updated_at").order("created_at",{ascending:false});
 if(error){console.error(error);container.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:30px;color:#b00020">Could not load products: '+esc(error.message)+'</p>';return;}
 renderProducts(data||[]);
}

function renderProducts(products){
 const container=document.getElementById("admin-products-grid");
 container.innerHTML="";
 if(!products.length){container.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:30px;color:#6d5550">No products added yet.</p>';return;}
 products.forEach(product=>{
  const card=document.createElement("div");card.className="admin-product-card";
  const image=product.image_url?'<img src="'+esc(product.image_url)+'" alt="'+esc(product.name)+'">':'Jewellery Image';
  const status=product.is_active?'<span class="status-badge active-status">Active</span>':'<span class="status-badge inactive-status">Inactive</span>';
  card.innerHTML='<div class="product-image">'+image+'</div><h3>'+esc(product.name)+'</h3><div class="product-price">'+esc(product.price)+' BDT</div><div class="product-category">'+esc(product.category)+'</div><p style="font-size:13px;color:#6d5550">'+esc(product.description||"")+'</p>'+status+'<div class="product-actions"><button class="button brown-button" type="button">✏️ Edit</button><button class="button gray-button" type="button">🗑️ Delete</button></div>';
  card.querySelectorAll("button")[0].addEventListener("click",()=>editProduct(product));
  card.querySelectorAll("button")[1].addEventListener("click",()=>deleteProduct(product));
  container.appendChild(card);
 });
}

async function saveProduct(){
 const name=document.getElementById("product-name").value.trim();
 const price=Number(document.getElementById("product-price").value);
 const category=document.getElementById("product-category").value;
 const description=document.getElementById("product-description").value.trim();
 const image_url=document.getElementById("product-image-url").value.trim()||null;
 if(!name||!price||!category){alert("Please enter product name, price and category.");return;}
 const button=document.getElementById("form-button");button.disabled=true;
 try{
  let result;
  if(editingProductId){
   result=await supabaseClient.from("products").update({name,price,category,description,image_url,updated_at:new Date().toISOString()}).eq("id",editingProductId).select().single();
  }else{
   result=await supabaseClient.from("products").insert({name,price,category,description,image_url,is_active:true}).select().single();
  }
  if(result.error){console.error(result.error);alert("❌ Could not save product: "+result.error.message);return;}
  alert(editingProductId?"✅ Product updated successfully!":"❤️ Product added successfully!");
  clearProductForm();await loadProducts();
 }finally{button.disabled=false;}
}

function editProduct(product){
 editingProductId=product.id;
 document.getElementById("product-name").value=product.name||"";
 document.getElementById("product-price").value=product.price||"";
 document.getElementById("product-category").value=product.category||"";
 document.getElementById("product-description").value=product.description||"";
 document.getElementById("product-image-url").value=product.image_url||"";
 document.getElementById("form-title").textContent="✏️ Edit Product";
 document.getElementById("form-button").textContent="✏️ Update Product";
 document.getElementById("cancel-button").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(product){
 if(!confirm('Are you sure you want to delete "'+product.name+'"?'))return;
 const {error}=await supabaseClient.from("products").delete().eq("id",product.id);
 if(error){console.error(error);alert("❌ Could not delete product: "+error.message);return;}
 alert("🗑️ Product deleted successfully.");
 if(editingProductId===product.id)clearProductForm();
 await loadProducts();
}

function clearProductForm(){
 document.getElementById("product-name").value="";
 document.getElementById("product-price").value="";
 document.getElementById("product-category").value="";
 document.getElementById("product-description").value="";
 document.getElementById("product-image-url").value="";
 editingProductId=null;
 document.getElementById("form-title").textContent="➕ Add New Product";
 document.getElementById("form-button").textContent="➕ Add Product";
 document.getElementById("cancel-button").style.display="none";
}

window.addEventListener("DOMContentLoaded",async()=>{
 const allowed=await checkAdmin();
 if(allowed)await loadProducts();
});
</script>
</body>
</html>

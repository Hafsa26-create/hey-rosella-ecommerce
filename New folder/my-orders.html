<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
        }

        .orders-page {

            max-width: 860px;
            margin: 40px auto;
            padding: 20px;
        }

        .orders-header {

            text-align: center;
            margin-bottom: 25px;
        }

        .orders-header h1 {

            font-size: 25px;
            margin-bottom: 8px;
        }

        .orders-header p {

            color: #474242;
        }

        .order-card {

            background: rgb(255, 231, 231);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
             font-size: 15px;
        }

        .order-card h3 {

            margin-top: 7;
            color: #3e2723;
        }

        .order-info {

            margin: 8px 0;
        }

        .order-status {

            font-weight: bold;
            margin-top: 10px;
        }

        .track-button {

            display: inline-block;
            margin-top: 20px;
            padding: 5px 20px;
            background: #d4af37;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
             font-size: 13px;
        }

        .back-button {

            display: inline-block;
            margin-top: 40px;
            padding: 2px 20px;
            background: #3e2723;
            color: white;
            text-decoration: none;
            border-radius: 8px;
             font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="orders-page">

        <div class="orders-header">

            <h1>
                📦 My Orders
            </h1>

            <p>
                View your recent orders and track your deliveries.
            </p>

        </div>


        <!-- ORDER 1 -->

        <div class="order-card">

            <h3>
                Order #HR1001
            </h3>

            <div class="order-info">
                Product: Elegant Necklace
            </div>

            <div class="order-info">
                Price: 850 BDT
            </div>

            <div class="order-status">
                Status: Shipped
            </div>

            <a
                href="order-tracking.html"
                class="track-button"
            >
                🚚 Track This Order
            </a>

        </div>


        <!-- ORDER 2 -->

        <div class="order-card">

            <h3>
                Order #HR1002
            </h3>

            <div class="order-info">
                Product: Beautiful Bracelet
            </div>

            <div class="order-info">
                Price: 750 BDT
            </div>

            <div class="order-status">
                Status: Shipped
            </div>

            <a
                href="order-tracking.html"
                class="track-button"
            >
                🚚 Track This Order
            </a>

        </div>


        <a
           href="my-account.html"
           class="back-button"
        >
          ← Back to My Account
        </a>

    </div>

</body>

</html>

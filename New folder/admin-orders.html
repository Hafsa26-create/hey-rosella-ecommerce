<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Orders - Hey Rosella</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            color: #3e2723;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            background: #3e2723;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

        }


        .admin-logo {

            font-size: 24px;
            font-weight: bold;

        }


        .admin-badge {

            background: #d4af37;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        /* =========================
           PAGE
        ========================= */

        .orders-page {

            max-width: 1150px;

            margin: 40px auto;

            padding: 0 25px;

        }


        .page-header {

            margin-bottom: 25px;

        }


        .page-header h1 {

            margin-bottom: 8px;

        }


        .page-header p {

            color: #6d5550;

        }


        /* =========================
           ORDER FILTER
        ========================= */

        .filter-box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

            margin-bottom: 25px;

        }


        .filter-box label {

            font-weight: bold;

            margin-right: 10px;

        }


        .filter-box select {

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            min-width: 200px;

        }


        /* =========================
           ORDERS CONTAINER
        ========================= */

        .orders-container {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

        }


        .orders-container h2 {

            margin-top: 0;

        }


        /* =========================
           ORDER CARD
        ========================= */

        .order-card {

            background: #fff8fa;

            border: 1px solid #f0dfe5;

            border-radius: 10px;

            padding: 20px;

            margin-top: 15px;

        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .order-id {

            font-weight: bold;

            font-size: 17px;

        }


        .order-date {

            font-size: 13px;

            color: #6d5550;

        }


        /* =========================
           STATUS
        ========================= */

        .status-badge {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .status-pending {

            background: #fff0b3;

            color: #6b5600;

        }


        .status-processing {

            background: #dceeff;

            color: #24527a;

        }


        .status-shipped {

            background: #e5ddff;

            color: #503c86;

        }


        .status-delivered {

            background: #d9f5df;

            color: #27653a;

        }


        .status-cancelled {

            background: #ffdcdc;

            color: #8a2c2c;

        }


        /* =========================
           CUSTOMER INFO
        ========================= */

        .customer-info {

            margin-top: 18px;

            padding: 15px;

            background: white;

            border-radius: 8px;

        }


        .customer-info p {

            margin: 7px 0;

        }


        /* =========================
           ORDER ITEMS
        ========================= */

        .order-items {

            margin-top: 15px;

        }


        .order-item {

            display: flex;

            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #eee;

        }


        .order-item:last-child {

            border-bottom: none;

        }


        /* =========================
           TOTAL
        ========================= */

        .order-total {

            margin-top: 15px;

            padding-top: 15px;

            border-top: 2px solid #eee;

            font-size: 18px;

            font-weight: bold;

            text-align: right;

            color: #d4af37;

        }


        /* =========================
           ORDER ACTIONS
        ========================= */

        .order-actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        .order-actions select {

            flex: 1;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 6px;

        }


        .button {

            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

        }


        .gold-button {

            background: #d4af37;

            color: white;

        }


        .brown-button {

            background: #3e2723;

            color: white;

        }


        .gray-button {

            background: #eee;

            color: #3e2723;

        }


        /* =========================
           NO ORDERS
        ========================= */

        .no-orders {

            text-align: center;

            padding: 40px;

            color: #6d5550;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: block;

            width: 250px;

            margin: 30px auto;

            padding: 12px;

            background: #3e2723;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 6px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .orders-page {

                padding: 0 15px;

            }


            .admin-header {

                padding: 15px;

            }


            .admin-logo {

                font-size: 19px;

            }


            .order-actions {

                flex-direction: column;

            }


            .filter-box select {

                width: 100%;

                margin-top: 10px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">

        <div class="admin-logo">

            Hey Rosella 💎

        </div>


        <div class="admin-badge">

            ADMIN

        </div>

    </header>


    <!-- =========================
         ORDERS PAGE
    ========================= -->

    <main class="orders-page">


        <div class="page-header">

            <h1>

                📦 Order Management

            </h1>


            <p>

                View and manage customer orders.

            </p>

        </div>


        <!-- =========================
             FILTER
        ========================= -->

        <section class="filter-box">

            <label for="order-filter">

                Filter Orders:

            </label>


            <select
                id="order-filter"
                onchange="filterOrders()"
            >

                <option value="all">

                    All Orders

                </option>


                <option value="Pending">

                    Pending

                </option>


                <option value="Processing">

                    Processing

                </option>


                <option value="Shipped">

                    Shipped

                </option>


                <option value="Delivered">

                    Delivered

                </option>


                <option value="Cancelled">

                    Cancelled

                </option>

            </select>

        </section>


        <!-- =========================
             ORDERS
        ========================= -->

        <section class="orders-container">

            <h2>

                📋 Customer Orders

            </h2>


            <div id="orders-list">

                <!-- Orders will appear here -->

            </div>

        </section>


        <!-- BACK -->

        <a
            href="admin.html"
            class="back-button"
        >

            ← Back to Admin Dashboard

        </a>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // =====================================================
        // SAMPLE ORDERS
        // =====================================================

        let adminOrders = [

            {

                id: "HR1001",

                date: "18 August 2026",

                customerName: "Hafsa",

                email: "customer@example.com",

                phone: "01700000000",

                address: "Dhaka, Bangladesh",

                items: [

                    {

                        name: "Elegant Necklace",

                        quantity: 1,

                        price: 850

                    },

                    {

                        name: "Classic Earrings",

                        quantity: 2,

                        price: 650

                    }

                ],

                total: 2150,

                status: "Pending"

            },


            {

                id: "HR1002",

                date: "18 August 2026",

                customerName: "Customer Two",

                email: "customer2@example.com",

                phone: "01800000000",

                address: "Chattogram, Bangladesh",

                items: [

                    {

                        name: "Beautiful Bracelet",

                        quantity: 1,

                        price: 750

                    }

                ],

                total: 750,

                status: "Processing"

            }

        ];


        // =====================================================
        // DISPLAY ORDERS
        // =====================================================

        function renderOrders(
            orders = adminOrders
        ) {


            const container =
                document.getElementById(
                    "orders-list"
                );


            container.innerHTML = "";


            // NO ORDERS

            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="no-orders">

                        📦 No orders found.

                    </div>

                `;

                return;

            }


            // CREATE ORDER CARDS

            orders.forEach(
                function(order) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";


                    const statusClass =
                        order.status
                            .toLowerCase();


                    card.innerHTML = `

                        <div class="order-header">

                            <div>

                                <div class="order-id">

                                    Order #${order.id}

                                </div>


                                <div class="order-date">

                                    ${order.date}

                                </div>

                            </div>


                            <span
                                class="
                                    status-badge
                                    status-${statusClass}
                                "
                            >

                                ${order.status}

                            </span>

                        </div>


                        <div class="customer-info">

                            <p>

                                <strong>
                                    👤 Customer:
                                </strong>

                                ${order.customerName}

                            </p>


                            <p>

                                <strong>
                                    📧 Email:
                                </strong>

                                ${order.email}

                            </p>


                            <p>

                                <strong>
                                    📞 Phone:
                                </strong>

                                ${order.phone}

                            </p>


                            <p>

                                <strong>
                                    📍 Address:
                                </strong>

                                ${order.address}

                            </p>

                        </div>


                        <div class="order-items">

                            <strong>
                                🛍️ Ordered Products
                            </strong>


                            ${order.items.map(
                                function(item) {

                                    return `

                                        <div
                                            class="order-item"
                                        >

                                            <span>

                                                ${item.name}
                                                ×
                                                ${item.quantity}

                                            </span>


                                            <span>

                                                ${
                                                    item.price *
                                                    item.quantity
                                                }

                                                BDT

                                            </span>

                                        </div>

                                    `;

                                }
                            ).join("")}

                        </div>


                        <div class="order-total">

                            Total:
                            ${order.total}
                            BDT

                        </div>


                        <div class="order-actions">


                            <select
                                onchange="
                                    updateOrderStatus(
                                        '${order.id}',
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value="Pending"
                                    ${
                                        order.status ===
                                        "Pending"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Pending

                                </option>


                                <option
                                    value="Processing"
                                    ${
                                        order.status ===
                                        "Processing"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Processing

                                </option>


                                <option
                                    value="Shipped"
                                    ${
                                        order.status ===
                                        "Shipped"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Shipped

                                </option>


                                <option
                                    value="Delivered"
                                    ${
                                        order.status ===
                                        "Delivered"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Delivered

                                </option>


                                <option
                                    value="Cancelled"
                                    ${
                                        order.status ===
                                        "Cancelled"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Cancelled

                                </option>

                            </select>


                            <button
                                type="button"
                                class="button brown-button"
                                onclick="
                                    deleteOrder(
                                        '${order.id}'
                                    )
                                "
                            >

                                🗑️ Delete

                            </button>

                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }


        // =====================================================
        // UPDATE ORDER STATUS
        // =====================================================

        function updateOrderStatus(
            orderId,
            newStatus
        ) {


            const order =
                adminOrders.find(
                    function(item) {

                        return item.id ===
                            orderId;

                    }
                );


            if (!order) {

                return;

            }


            order.status =
                newStatus;


            alert(
                "✅ Order status updated to " +
                newStatus
            );


            renderOrders();

        }


        // =====================================================
        // DELETE ORDER
        // =====================================================

        function deleteOrder(
            orderId
        ) {


            const confirmed =
                confirm(
                    "Are you sure you want to delete this order?"
                );


            if (!confirmed) {

                return;

            }


            adminOrders =
                adminOrders.filter(
                    function(order) {

                        return order.id !==
                            orderId;

                    }
                );


            alert(
                "🗑️ Order deleted successfully."
            );


            renderOrders();

        }


        // =====================================================
        // FILTER ORDERS
        // =====================================================

        function filterOrders() {


            const selectedStatus =
                document.getElementById(
                    "order-filter"
                ).value;


            if (
                selectedStatus ===
                "all"
            ) {

                renderOrders(
                    adminOrders
                );

                return;

            }


            const filteredOrders =
                adminOrders.filter(
                    function(order) {

                        return order.status ===
                            selectedStatus;

                    }
                );


            renderOrders(
                filteredOrders
            );

        }


        // =====================================================
        // LOAD PAGE
        // =====================================================

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                renderOrders();

            }
        );


    </script>


</body>

</html>

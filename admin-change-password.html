    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

        }


        .password-page {

        }


        .password-box {
            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }


        .password-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }


        .password-box > p {
            text-align: center;
            color: #4b4747;

        }


        .password-box label {

        }


        .password-box input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d4af37;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }


        .update-button {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }


        .update-button:hover {
            opacity: 0.9;
        }


        .back-button {
            width: 170px;
            display: block;
            text-align: center;
            margin: 25px 0 0 0;
            padding: 8px;
            background: #38221e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;

        #message {
            text-align: center;

        }

</head>


<body>

            <h1>
                🔐 Change Admin Password

            <p>
                Enter your new admin password below.
            </p>


            <label for="new-password">
                New Password
            </label>


            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
            >


            <label for="confirm-password">
                Confirm New Password
            </label>


            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
            >


            <button

                class="update-button"
                onclick="changeAdminPassword()"
            >
                Update Password
            </button>


            <p id="message"></p>


            <a
                href="admin.html"
                class="back-button"
            >
                ← Back to Admin Panel

        </div>

    </div>

        // =====================================================
        // CHANGE ADMIN PASSWORD
        // =====================================================

        async function changeAdminPassword() {


            const newPassword =
                document.getElementById(
                    "new-password"
                ).value.trim();


            const confirmPassword =
                document.getElementById(
                    "confirm-password"
                ).value.trim();


            const message =
                document.getElementById(
                    "message"
                );


            // CHECK EMPTY

            if (
                !newPassword ||
                !confirmPassword
            ) {

                message.style.color =
                    "#b00020";

                message.textContent =
                    "Please fill in both password fields.";

                return;
            }



            // CHECK PASSWORD LENGTH

            if (
                newPassword.length < 6
            ) {

                message.style.color =
                    "#b00020";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }



            // CHECK MATCH

            if (
                newPassword !==
                confirmPassword
            ) {

                message.style.color =
                    "#b00020";

                message.textContent =
                    "Passwords do not match.";

                return;
            }



            // CHECK ADMIN SESSION

            const allowed =
                await checkAdminAccess();


            if (!allowed) {

                return;
            }



            message.style.color =
                "#38221e";

            message.textContent =
                "Updating password...";



            // UPDATE PASSWORD

            const {
                error
            } =
                await supabaseClient.auth.updateUser({

                    password:
                        newPassword

                });



            if (error) {

                console.error(
                    "Password update error:",
                    error
                );


                message.style.color =
                    "#b00020";


                message.textContent =
                    "Could not update password.\n\n" +
                    error.message;


                return;
            }



            // SUCCESS

            message.style.color =
                "green";


            message.textContent =
                "✅ Admin password updated successfully!";



            // CLEAR INPUTS

            document.getElementById(
                "new-password"
            ).value = "";


            document.getElementById(
                "confirm-password"
            ).value = "";



            // GO BACK TO ADMIN PANEL

            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                2000
            );

        }



        // =====================================================
        // START ADMIN CHECK
        // =====================================================

        checkAdminAccess();


    </script>

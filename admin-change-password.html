<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Change Password - Hey Rosella</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
            font-size: 15px;
        }


        .password-page {
            max-width: 500px;
            margin: 70px auto;
            padding: 20px;
        }


        .password-box {
            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }


        .password-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }


        .password-box > p {
            text-align: center;
            color: #4b4747;
            margin-bottom: 25px;
        }


        .password-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }


        .password-box input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }


        .update-button {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }


        .update-button:hover {
            opacity: 0.9;
        }


        .back-button {
            width: 170px;
            display: block;
            text-align: center;
            margin: 25px 0 0 0;
            padding: 8px;
            background: #38221e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
        }


        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

    </style>

</head>


<body>


    <div class="password-page">

        <div class="password-box">


            <h1>
                🔐 Change Admin Password
            </h1>


            <p>
                Enter your new admin password below.
            </p>
    
            <label for="current-password">
               Current Password
            </label>

            <input
               type="password"
               id="current-password"
               placeholder="Enter your current password"
            >

            <label for="new-password">
                New Password
            </label>


            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
            >


            <label for="confirm-password">
                Confirm New Password
            </label>


            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
            >


            <button
                type="button"
                class="update-button"
                onclick="changeAdminPassword()"
            >
                Update Password
            </button>


            <p id="message"></p>


            <a
                href="admin.html"
                class="back-button"
            >
                ← Back to Admin Panel
            </a>


        </div>

    </div>



    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // =====================================================
        // CHECK ADMIN LOGIN
        // =====================================================

        async function checkAdminAccess() {


            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Admin session error:",
                    error
                );

                window.location.href =
                    "admin-login.html";

                return false;
            }
          
            const session = data.session;

            if (!session) {

    alert(
        "Please login as admin first."
    );

    window.location.href =
        "admin-login.html";

    return false;
}


// CHECK ADMIN ROLE

const {
    data: profile,
    error: profileError
} = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", session.user.id)
    .single();


if (profileError) {

    console.error(
        "Admin profile check error:",
        profileError
    );

    await supabaseClient.auth.signOut();

    alert(
        "Unable to verify admin access."
    );

    window.location.href =
        "admin-login.html";

    return false;
}


if (
    !profile ||
    String(profile.role).toLowerCase() !==
    "admin"
) {

    alert(
        "Access denied. Admin only."
    );

    await supabaseClient.auth.signOut();

    window.location.href =
        "admin-login.html";

    return false;
}


return true;

        }



       async function changeAdminPassword() {

    const currentPassword =
        document.getElementById(
            "current-password"
        ).value.trim();

    const newPassword =
        document.getElementById(
            "new-password"
        ).value.trim();

    const confirmPassword =
        document.getElementById(
            "confirm-password"
        ).value.trim();

    const message =
        document.getElementById(
            "message"
        );


    // CHECK EMPTY

    if (
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ) {

        message.style.color =
            "#b00020";

        message.textContent =
            "Please fill in all password fields.";

        return;
    }


    // CHECK NEW PASSWORD LENGTH

    if (
        newPassword.length < 6
    ) {

        message.style.color =
            "#b00020";

        message.textContent =
            "New password must be at least 6 characters.";

        return;
    }


    // CHECK PASSWORD MATCH

    if (
        newPassword !==
        confirmPassword
    ) {

        message.style.color =
            "#b00020";

        message.textContent =
            "New passwords do not match.";

        return;
    }


    // CHECK ADMIN SESSION

    const allowed =
        await checkAdminAccess();


    if (!allowed) {

        return;
    }


    message.style.color =
        "#38221e";

    message.textContent =
        "Verifying current password...";


    // GET CURRENT SESSION

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !sessionData.session
    ) {

        message.style.color =
            "#b00020";

        message.textContent =
            "Your session has expired. Please login again.";

        return;
    }


    const email =
        sessionData.session.user.email;


    // RE-AUTHENTICATE WITH CURRENT PASSWORD

    const {
        error: reauthError
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password:
                currentPassword

        });


    if (reauthError) {

        console.error(
            "Password verification error:",
            reauthError
        );

        message.style.color =
            "#b00020";

        message.textContent =
            "Current password is incorrect.";

        return;
    }


    // UPDATE PASSWORD

    message.style.color =
        "#38221e";

    message.textContent =
        "Updating password...";


    const {
        error
    } =
        await supabaseClient.auth.updateUser({

            password:
                newPassword

        });


    if (error) {

        console.error(
            "Password update error:",
            error
        );

        message.style.color =
            "#b00020";

        message.textContent =
            "Could not update password.\n\n" +
            error.message;

        return;
    }


    // SUCCESS

    message.style.color =
        "green";

    message.textContent =
        "✅ Admin password updated successfully!";


    // CLEAR INPUTS

    document.getElementById(
        "current-password"
    ).value = "";

    document.getElementById(
        "new-password"
    ).value = "";

    document.getElementById(
        "confirm-password"
    ).value = "";


    // GO BACK TO ADMIN PANEL

    setTimeout(
        function() {

            window.location.href =
                "admin.html";

        },
        2000
    );

}

        // =====================================================
        // START ADMIN CHECK
        // =====================================================

        checkAdminAccess();


    </script>


</body>

</html>

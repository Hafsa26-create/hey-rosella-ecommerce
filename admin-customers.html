<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Customers - Hey Rosella</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fff0f5;

            color: #3e2723;

        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            background: #3e2723;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .admin-logo {

            font-size: 24px;

            font-weight: bold;

        }


        .admin-badge {

            background: #d4af37;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        /* =========================
           PAGE
        ========================= */

        .customers-page {

            max-width: 1150px;

            margin: 40px auto;

            padding: 0 25px;

        }


        .page-header {

            margin-bottom: 25px;

        }


        .page-header h1 {

            margin-bottom: 8px;

        }


        .page-header p {

            color: #6d5550;

        }


        /* =========================
           SEARCH / FILTER
        ========================= */

        .control-box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

            margin-bottom: 25px;

        }


        .search-row {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .search-input {

            flex: 1;

            min-width: 220px;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 15px;

        }


        .filter-select {

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 6px;

            min-width: 180px;

        }


        /* =========================
           CUSTOMER CONTAINER
        ========================= */

        .customers-container {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

        }


        .customers-container h2 {

            margin-top: 0;

        }


        /* =========================
           CUSTOMER CARD
        ========================= */

        .customer-card {

            background: #fff8fa;

            border: 1px solid #f0dfe5;

            border-radius: 10px;

            padding: 20px;

            margin-top: 15px;

        }


        .customer-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .customer-name {

            font-size: 18px;

            font-weight: bold;

        }


        .customer-id {

            font-size: 12px;

            color: #777;

            margin-top: 4px;

        }


        /* =========================
           VERIFICATION BADGE
        ========================= */

        .verification-badge {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .verified {

            background: #d9f5df;

            color: #27653a;

        }


        .unverified {

            background: #fff0b3;

            color: #6b5600;

        }


        /* =========================
           CUSTOMER DETAILS
        ========================= */

        .customer-details {

            margin-top: 18px;

            padding: 15px;

            background: white;

            border-radius: 8px;

        }


        .customer-details p {

            margin: 8px 0;

        }


        /* =========================
           ACTIONS
        ========================= */

        .customer-actions {

            display: flex;

            gap: 10px;

            margin-top: 18px;

            flex-wrap: wrap;

        }


        .button {

            padding: 10px 16px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

        }


        .gold-button {

            background: #d4af37;

            color: white;

        }


        .brown-button {

            background: #3e2723;

            color: white;

        }


        .gray-button {

            background: #eee;

            color: #3e2723;

        }


        .red-button {

            background: #b83b3b;

            color: white;

        }


        /* =========================
           NO CUSTOMERS
        ========================= */

        .no-customers {

            text-align: center;

            padding: 40px;

            color: #6d5550;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: block;

            width: 250px;

            margin: 30px auto;

            padding: 12px;

            background: #3e2723;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 6px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .customers-page {

                padding: 0 15px;

            }


            .admin-header {

                padding: 15px;

            }


            .admin-logo {

                font-size: 19px;

            }


            .search-row {

                flex-direction: column;

            }


            .search-input,
            .filter-select {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">

        <div class="admin-logo">

            Hey Rosella 💎

        </div>


        <div class="admin-badge">

            ADMIN

        </div>

    </header>


    <!-- =========================
         CUSTOMERS PAGE
    ========================= -->

    <main class="customers-page">


        <div class="page-header">

            <h1>

                👥 Customer Management

            </h1>


            <p>

                View and manage your Hey Rosella customers.

            </p>

        </div>


        <!-- =========================
             SEARCH / FILTER
        ========================= -->

        <section class="control-box">


            <div class="search-row">


                <input
                    type="text"
                    id="customer-search"
                    class="search-input"
                    placeholder="🔍 Search by name, email or phone..."
                    oninput="filterCustomers()"
                >


                <select
                    id="verification-filter"
                    class="filter-select"
                    onchange="filterCustomers()"
                >

                    <option value="all">

                        All Customers

                    </option>


                    <option value="verified">

                        ✅ Verified

                    </option>


                    <option value="unverified">

                        ⚠️ Unverified

                    </option>

                </select>


            </div>

        </section>


        <!-- =========================
             CUSTOMER LIST
        ========================= -->

        <section class="customers-container">


            <h2>

                📋 Customer List

            </h2>


            <div id="customers-list">

                <!-- Customers appear here -->

            </div>


        </section>


        <!-- =========================
             BACK
        ========================= -->

        <a
            href="admin.html"
            class="back-button"
        >

            ← Back to Admin Dashboard

        </a>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // =====================================================
        // SAMPLE CUSTOMERS
        // =====================================================

        let adminCustomers = [

            {

                id: "CUS1001",

                name: "Hafsa",

                email: "hafsa@example.com",

                phone: "01700000000",

                joined: "18 August 2026",

                verified: true

            },


            {

                id: "CUS1002",

                name: "Rosella Customer",

                email: "customer@example.com",

                phone: "01800000000",

                joined: "17 August 2026",

                verified: false

            },


            {

                id: "CUS1003",

                name: "Nusrat",

                email: "nusrat@example.com",

                phone: "01900000000",

                joined: "15 August 2026",

                verified: true

            }

        ];


        // =====================================================
        // DISPLAY CUSTOMERS
        // =====================================================

        function renderCustomers(
            customers = adminCustomers
        ) {


            const container =
                document.getElementById(
                    "customers-list"
                );


            container.innerHTML = "";


            // NO CUSTOMERS

            if (customers.length === 0) {

                container.innerHTML = `

                    <div class="no-customers">

                        👥 No customers found.

                    </div>

                `;

                return;

            }


            // CREATE CUSTOMER CARDS

            customers.forEach(
                function(customer) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "customer-card";


                    const verificationClass =
                        customer.verified
                            ? "verified"
                            : "unverified";


                    const verificationText =
                        customer.verified
                            ? "✅ Verified"
                            : "⚠️ Unverified";


                    card.innerHTML = `


                        <div class="customer-header">


                            <div>


                                <div class="customer-name">

                                    ${customer.name}

                                </div>


                                <div class="customer-id">

                                    Customer ID:
                                    ${customer.id}

                                </div>


                            </div>


                            <span
                                class="
                                    verification-badge
                                    ${verificationClass}
                                "
                            >

                                ${verificationText}

                            </span>


                        </div>



                        <div class="customer-details">


                            <p>

                                <strong>
                                    📧 Email:
                                </strong>

                                ${customer.email}

                            </p>


                            <p>

                                <strong>
                                    📞 Phone:
                                </strong>

                                ${customer.phone}

                            </p>


                            <p>

                                <strong>
                                    📅 Joined:
                                </strong>

                                ${customer.joined}

                            </p>


                        </div>



                        <div class="customer-actions">


                            <button
                                type="button"
                                class="button gold-button"
                                onclick="
                                    viewCustomer(
                                        '${customer.id}'
                                    )
                                "
                            >

                                👁️ View Details

                            </button>


                            <button
                                type="button"
                                class="button brown-button"
                                onclick="
                                    toggleCustomerVerification(
                                        '${customer.id}'
                                    )
                                "
                            >

                                ${
                                    customer.verified
                                        ? "⚠️ Mark Unverified"
                                        : "✅ Mark Verified"
                                }

                            </button>


                            <button
                                type="button"
                                class="button red-button"
                                onclick="
                                    deleteCustomer(
                                        '${customer.id}'
                                    )
                                "
                            >

                                🗑️ Delete

                            </button>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }


        // =====================================================
        // SEARCH + FILTER
        // =====================================================

        function filterCustomers() {


            const search =
                document.getElementById(
                    "customer-search"
                ).value
                .toLowerCase()
                .trim();


            const verificationFilter =
                document.getElementById(
                    "verification-filter"
                ).value;


            const filteredCustomers =
                adminCustomers.filter(
                    function(customer) {


                        const matchesSearch =

                            customer.name
                                .toLowerCase()
                                .includes(search)

                            ||

                            customer.email
                                .toLowerCase()
                                .includes(search)

                            ||

                            customer.phone
                                .includes(search);


                        const matchesVerification =

                            verificationFilter ===
                            "all"

                            ||

                            (
                                verificationFilter ===
                                "verified"
                                &&
                                customer.verified
                            )

                            ||

                            (
                                verificationFilter ===
                                "unverified"
                                &&
                                !customer.verified
                            );


                        return (
                            matchesSearch
                            &&
                            matchesVerification
                        );

                    }
                );


            renderCustomers(
                filteredCustomers
            );

        }


        // =====================================================
        // VIEW CUSTOMER
        // =====================================================

        function viewCustomer(
            customerId
        ) {


            const customer =
                adminCustomers.find(
                    function(item) {

                        return item.id ===
                            customerId;

                    }
                );


            if (!customer) {

                return;

            }


            alert(

                "👤 Customer Details\n\n" +

                "Name: " +
                customer.name +

                "\nEmail: " +
                customer.email +

                "\nPhone: " +
                customer.phone +

                "\nJoined: " +
                customer.joined +

                "\nVerified: " +
                (
                    customer.verified
                        ? "Yes"
                        : "No"
                )

            );

        }


        // =====================================================
        // VERIFY / UNVERIFY
        // =====================================================

        function toggleCustomerVerification(
            customerId
        ) {


            const customer =
                adminCustomers.find(
                    function(item) {

                        return item.id ===
                            customerId;

                    }
                );


            if (!customer) {

                return;

            }


            customer.verified =
                !customer.verified;


            alert(

                customer.verified

                    ? "✅ Customer marked as verified."

                    : "⚠️ Customer marked as unverified."

            );


            renderCustomers();

        }


        // =====================================================
        // DELETE CUSTOMER
        // =====================================================

        function deleteCustomer(
            customerId
        ) {


            const customer =
                adminCustomers.find(
                    function(item) {

                        return item.id ===
                            customerId;

                    }
                );


            if (!customer) {

                return;

            }


            const confirmed =
                confirm(

                    `Are you sure you want to delete "${customer.name}"?`

                );


            if (!confirmed) {

                return;

            }


            adminCustomers =
                adminCustomers.filter(
                    function(item) {

                        return item.id !==
                            customerId;

                    }
                );


            alert(
                "🗑️ Customer deleted successfully."
            );


            filterCustomers();

        }


        // =====================================================
        // LOAD CUSTOMERS
        // =====================================================

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                renderCustomers();

            }
        );


    </script>


</body>

</html>

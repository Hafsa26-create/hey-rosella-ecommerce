<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
            font-size: 15px;
        }

        .forgot-page {
            max-width: 500px;
            margin: 60px auto ;
            padding: 20px;
        }

        .forgot-box {
            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .forgot-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .forgot-box p {
            text-align: center;
            color: #4b4747;
            margin-bottom: 25px;
        }

        .forgot-box input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
        }

        .reset-button {
            width: 100%;
            padding: 8px;
            margin-top: 30px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-button {
    width: 150px;
    display: block;
    text-align: center;
    margin: 30px 0 0 0;
    padding: 2px;
    background: #38221e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 13px;
}

    </style>

</head>


<body>

    <div class="forgot-page">

        <div class="forgot-box">

            <h1>
                🔑 Forgot Password
            </h1>

            <p>
                Enter your email address and we'll
                send you a password reset link.
            </p>


            <input
                type="email"
                id="forgot-password-email"
                placeholder="Enter your email"
            >


            <button
                type="button"
                class="reset-button"
                onclick="sendPasswordReset()"
            >
                Send Reset Link
            </button>


            <a
               href="my-account.html"
               class="back-button"
            >
             ← Back to My Account
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function sendPasswordReset() {

            const email =
                document.getElementById(
                    "forgot-password-email"
                ).value.trim();


            if (!email) {

                alert(
                    "Please enter your email address."
                );

                return;
            }


            const {
    error
} = await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
        redirectTo:
            window.location.origin + "/reset-password.html"
    }
);

            if (error) {

                console.error(
                    "Password reset error:",
                    error
                );

                alert(
                    "Could not send reset link.\n\n" +
                    error.message
                );

                return;
            }


            alert(
                "📧 Password reset link has been sent to your email!"
            );

        }

    </script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Your Order - Hey Rosella</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #3e2723;
        }

        .tracking-page {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .tracking-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .tracking-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .tracking-header p {
            color: #555;
            margin: 0;
        }

        .tracking-box {
            background: rgb(255, 231, 231);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .tracking-input {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tracking-input input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #d4af37;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .tracking-input input:focus {
            border-color: #3e2723;
        }

        .tracking-input button {
            padding: 13px 20px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tracking-input button:hover {
            background: #3e2723;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe0e0;
            color: #a00000;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #27632a;
        }

        .order-details {
            display: none;
            margin-top: 20px;
        }

        .order-details h2 {
            margin: 0 0 20px;
            color: #3e2723;
        }

        .order-info {
            background: #fff8fa;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .order-info strong {
            color: #3e2723;
        }

        .products-list {
            margin-top: 10px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px;
            margin-bottom: 8px;
            background: #fafafa;
            border-radius: 7px;
            border: 1px solid #eee;
        }

        .product-name {
            font-weight: bold;
        }

        .product-price {
            white-space: nowrap;
        }

        .tracking-status {
            margin-top: 25px;
        }

        .tracking-status h3 {
            margin-bottom: 15px;
            color: #3e2723;
        }

        .status-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin: 8px 0;
            border-radius: 8px;
            background: #f5f5f5;
            color: #777;
        }

        .status-step.active {
            background: #eadfbd;
            color: #3e2723;
            font-weight: bold;
        }

        .status-icon {
            font-size: 18px;
            width: 25px;
            text-align: center;
        }

        .current-status {
            margin-top: 20px;
            padding: 15px;
            background: #fff2c7;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #3e2723;
        }

        .back-button {
    width: 170px;
    display: block;
    text-align: center;
    margin: 30px 0 0 0;
    padding: 5px;
    background: #38221e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
}

        .back-button:hover {
            background: #d4af37;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .tracking-page {
                margin: 20px auto;
                padding: 15px;
            }

            .tracking-header h1 {
                font-size: 27px;
            }

            .tracking-box {
                padding: 18px;
            }

            .tracking-input {
                flex-direction: column;
            }

            .tracking-input button {
                width: 100%;
            }

            .product-item {
                flex-direction: column;
                gap: 5px;
            }

        }

    </style>

</head>


<body>

    <div class="tracking-page">

        <div class="tracking-header">

            <h1>
                🚚 Track Your Order
            </h1>

            <p>
                Enter your Order ID to check your order status.
            </p>

        </div>


        <div class="tracking-box">


            <!-- SEARCH ORDER -->

            <div class="tracking-input">

                <input
                    type="text"
                    id="order-id-input"
                    placeholder="Enter Order ID"
                >

                <button
                    type="button"
                    onclick="trackOrder()"
                >
                    Track Order
                </button>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- ORDER DETAILS -->

            <div
                id="order-details"
                class="order-details"
            >

                <h2>
                    Order #
                    <span id="display-order-id"></span>
                </h2>


                <!-- DATE -->

                <div class="order-info">

                    <strong>
                        Order Date:
                    </strong>

                    <span id="order-date">
                        -
                    </span>

                </div>


                <!-- PRODUCTS -->

                <div class="order-info">

                    <strong>
                        Products:
                    </strong>

                    <div
                        id="products-list"
                        class="products-list"
                    ></div>

                </div>


                <!-- TOTAL -->

                <div class="order-info">

                    <strong>
                        Total:
                    </strong>

                    <span id="order-total">
                        -
                    </span>

                    BDT

                </div>


                <!-- PAYMENT -->

                <div class="order-info">

                    <strong>
                        Payment:
                    </strong>

                    <span id="payment-method">
                        -
                    </span>

                </div>


                <!-- CURRENT STATUS -->

                <div
                    id="current-status"
                    class="current-status"
                >
                    Status: -
                </div>


                <!-- TRACKING TIMELINE -->

                <div class="tracking-status">

                    <h3>
                        Order Progress
                    </h3>


                    <div
                        id="status-placed"
                        class="status-step"
                    >

                        <span class="status-icon">
                            ○
                        </span>

                        Order Placed

                    </div>


                    <div
                        id="status-confirmed"
                        class="status-step"
                    >

                        <span class="status-icon">
                            ○
                        </span>

                        Order Confirmed

                    </div>


                    <div
                        id="status-processing"
                        class="status-step"
                    >

                        <span class="status-icon">
                            ○
                        </span>

                        Processing

                    </div>


                    <div
                        id="status-shipped"
                        class="status-step"
                    >

                        <span class="status-icon">
                            ○
                        </span>

                        Shipped

                    </div>


                    <div
                        id="status-delivered"
                        class="status-step"
                    >

                        <span class="status-icon">
                            ○
                        </span>

                        Delivered

                    </div>

                </div>

            </div>


            <!-- BACK BUTTON -->

            <a
                href="my-orders.html"
                class="back-button"
            >
                ← Back to My Orders
            </a>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================
           SUPABASE CONFIG
        ========================= */

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           ELEMENTS
        ========================= */

        const orderInput =
            document.getElementById(
                "order-id-input"
            );

        const message =
            document.getElementById(
                "message"
            );

        const orderDetails =
            document.getElementById(
                "order-details"
            );


        /* =========================
           SHOW MESSAGE
        ========================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        /* =========================
           CLEAR MESSAGE
        ========================= */

        function clearMessage() {

            message.textContent = "";

            message.className =
                "message";

        }


        /* =========================
           FORMAT STATUS
        ========================= */

        function normalizeStatus(
            status
        ) {

            if (!status) {

                return "placed";

            }

            return status
                .toString()
                .trim()
                .toLowerCase();

        }


        /* =========================
           STATUS ORDER
        ========================= */

        const statusOrder = [

            "placed",
            "confirmed",
            "processing",
            "shipped",
            "delivered"

        ];


        /* =========================
           GET STATUS INDEX
        ========================= */

        function getStatusIndex(
            status
        ) {

            status =
                normalizeStatus(status);


            if (
                status.includes(
                    "deliver"
                )
            ) {

                return 4;

            }

            if (
                status.includes(
                    "ship"
                )
            ) {

                return 3;

            }

            if (
                status.includes(
                    "process"
                )
            ) {

                return 2;

            }

            if (
                status.includes(
                    "confirm"
                )
            ) {

                return 1;

            }

            return 0;

        }


        /* =========================
           UPDATE TIMELINE
        ========================= */

        function updateTimeline(
            status
        ) {

            const currentIndex =
                getStatusIndex(
                    status
                );


            const steps = [

                {
                    id: "status-placed",
                    index: 0,
                    text: "Order Placed"
                },

                {
                    id: "status-confirmed",
                    index: 1,
                    text: "Order Confirmed"
                },

                {
                    id: "status-processing",
                    index: 2,
                    text: "Processing"
                },

                {
                    id: "status-shipped",
                    index: 3,
                    text: "Shipped"
                },

                {
                    id: "status-delivered",
                    index: 4,
                    text: "Delivered"
                }

            ];


            steps.forEach(
                function(step) {

                    const element =
                        document.getElementById(
                            step.id
                        );

                    const icon =
                        element.querySelector(
                            ".status-icon"
                        );


                    if (
                        step.index <=
                        currentIndex
                    ) {

                        element.classList.add(
                            "active"
                        );

                        icon.textContent =
                            "✓";

                    } else {

                        element.classList.remove(
                            "active"
                        );

                        icon.textContent =
                            "○";

                    }

                }
            );

        }


        /* =========================
           FORMAT DATE
        ========================= */

        function formatDate(
            date
        ) {

            if (!date) {

                return "N/A";

            }

            return new Date(
                date
            ).toLocaleDateString(
                "en-BD",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* =========================
           DISPLAY PRODUCTS
        ========================= */

        function displayProducts(
            products
        ) {

            const container =
                document.getElementById(
                    "products-list"
                );


            container.innerHTML = "";


            /*
                Supabase JSON/JSONB may return
                an array directly.
            */

            if (
                typeof products ===
                "string"
            ) {

                try {

                    products =
                        JSON.parse(
                            products
                        );

                } catch (error) {

                    console.error(
                        "Product JSON parse error:",
                        error
                    );

                    products = [];

                }

            }


            if (
                !Array.isArray(
                    products
                )
            ) {

                container.innerHTML =
                    "<div>No product information available.</div>";

                return;

            }


            products.forEach(
                function(product) {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "product-item";


                    const name =
                        product.name ||
                        "Product";


                    const quantity =
                        product.quantity ||
                        1;


                    const price =
                        product.price ||
                        0;


                    item.innerHTML = `

                        <span class="product-name">

                            ${name}

                            × ${quantity}

                        </span>

                        <span class="product-price">

                            ${price} BDT

                        </span>

                    `;


                    container.appendChild(
                        item
                    );

                }
            );

        }


        /* =========================
           FIND ORDER
        ========================= */

        async function trackOrder() {

            const orderId =
                orderInput.value.trim();


            clearMessage();


            orderDetails.style.display =
                "none";


            if (!orderId) {

                showMessage(
                    "Please enter your Order ID.",
                    "error"
                );

                return;

            }


            showMessage(
                "Searching for your order...",
                "success"
            );


            try {


                /* =========================
                   GET LOGGED-IN USER
                ========================= */

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (sessionError) {

                    console.error(
                        "Session error:",
                        sessionError
                    );

                }


                const session =
                    sessionData?.session;


                /*
                    Customer must be logged in
                    to track their own order.
                */

                if (!session) {

                    showMessage(
                        "Please login to track your order.",
                        "error"
                    );

                    return;

                }


                const user =
                    session.user;


                /* =========================
                   GET ORDER
                ========================= */

                const {
                    data: order,
                    error
                } =
                    await supabaseClient
                        .from("Hey Rosella")
                        .select("*")
                        .eq(
                            "order_number",
                            orderId
                        )
                        .eq(
                            "user_id",
                            user.id
                        )
                        .maybeSingle();


                /* =========================
                   DATABASE ERROR
                ========================= */

                if (error) {

                    console.error(
                        "Order tracking error:",
                        error
                    );

                    showMessage(
                        "Could not load the order. Please try again.",
                        "error"
                    );

                    return;

                }


                /* =========================
                   ORDER NOT FOUND
                ========================= */

                if (!order) {

                    showMessage(
                        "Order not found. Please check your Order ID.",
                        "error"
                    );

                    return;

                }


                /* =========================
                   DISPLAY ORDER ID
                ========================= */

                document.getElementById(
                    "display-order-id"
                ).textContent =
                    order.order_number;


                /* =========================
                   DATE
                ========================= */

                document.getElementById(
                    "order-date"
                ).textContent =
                    formatDate(
                        order.created_at
                    );


                /* =========================
                   PRODUCTS
                ========================= */

                displayProducts(
                    order.products
                );


                /* =========================
                   TOTAL
                ========================= */

                document.getElementById(
                    "order-total"
                ).textContent =
                    order.total_amount ??
                    "0";


                /* =========================
                   PAYMENT
                ========================= */

                document.getElementById(
                    "payment-method"
                ).textContent =
                    order.payment_method ||
                    "N/A";


                /* =========================
                   STATUS
                ========================= */

                const currentStatus =
                    order.order_status ||
                    "Order Placed";


                document.getElementById(
                    "current-status"
                ).textContent =
                    "Status: " +
                    currentStatus;


                /* =========================
                   UPDATE TIMELINE
                ========================= */

                updateTimeline(
                    currentStatus
                );


                /* =========================
                   SHOW DETAILS
                ========================= */

                orderDetails.style.display =
                    "block";


                showMessage(
                    "Order found successfully.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Tracking error:",
                    error
                );

                showMessage(
                    "Something went wrong. Please try again.",
                    "error"
                );

            }

        }


        /* =========================
           AUTO TRACK FROM URL
        ========================= */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const orderNumber =
                    params.get(
                        "order"
                    );


                if (orderNumber) {

                    orderInput.value =
                        orderNumber;

                    trackOrder();

                }

            }
        );


        /* =========================
           ENTER KEY SUPPORT
        ========================= */

        orderInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    trackOrder();

                }

            }
        );

    </script>

</body>

</html>

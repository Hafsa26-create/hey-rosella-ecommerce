<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
            font-size: 15px;
        }

        .password-page {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .password-box {
            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .password-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .password-header h1 {
            margin-bottom: 8px;
        }

        .password-header p {
            color: #4d4747;
        }

        .password-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .password-box input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
        }

        .update-button {
            width: 100%;
            padding: 8px;
            margin-top: 40px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

      .back-button {
    width: 170px;
    display: block;
    text-align: center;
    margin: 30px 0 0 0;
    padding: 5px;
    background: #38221e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
}

    </style>

</head>


<body>

    <div class="password-page">

        <div class="password-box">

            <div class="password-header">

                <h1>
                    🔐 Change Password
                </h1>

                <p>
                    Create a new password for your account.
                </p>

            </div>


            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
            >


            <label for="confirm-new-password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm-new-password"
                placeholder="Confirm new password"
            >


            <button
                type="button"
                class="update-button"
                onclick="updateCustomerPassword()"
            >
                Update Password
            </button>


            <a
                href="my-account.html"
                class="back-button"
            >
                ← Back to My Account
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function updateCustomerPassword() {

            const newPassword =
                document.getElementById(
                    "new-password"
                ).value;

            const confirmPassword =
                document.getElementById(
                    "confirm-new-password"
                ).value;


            if (
                !newPassword ||
                !confirmPassword
            ) {

                alert(
                    "Please enter your new password and confirm password."
                );

                return;
            }


            if (
                newPassword !==
                confirmPassword
            ) {

                alert(
                    "Passwords do not match."
                );

                return;
            }


            if (newPassword.length < 6) {

                alert(
                    "Password must be at least 6 characters."
                );

                return;
            }


            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (
                sessionError ||
                !sessionData.session
            ) {

                alert(
                    "Please login to change your password."
                );

                window.location.href =
                    "index.html";

                return;
            }


            const {
                error
            } =
                await supabaseClient.auth.updateUser({

                    password: newPassword

                });


            if (error) {

                console.error(
                    "Password update error:",
                    error
                );

                alert(
                    "Could not update your password.\n\n" +
                    error.message
                );

                return;
            }


            alert(
                "🔐 Your password has been changed successfully! ✨"
            );


            document.getElementById(
                "new-password"
            ).value = "";

            document.getElementById(
                "confirm-new-password"
            ).value = "";

        }

    </script>

</body>

</html>

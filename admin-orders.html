<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Orders - Hey Rosella</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fff0f5;

            color: #3e2723;

        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            background: #3e2723;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .admin-logo {

            font-size: 24px;

            font-weight: bold;

        }


        .admin-badge {

            background: #d4af37;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        /* =========================
           PAGE
        ========================= */

        .orders-page {

            max-width: 1150px;

            margin: 40px auto;

            padding: 0 25px;

        }


        .page-header {

            margin-bottom: 25px;

        }


        .page-header h1 {

            margin-bottom: 8px;

        }


        .page-header p {

            color: #6d5550;

        }


        /* =========================
           FILTER
        ========================= */

        .filter-box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            margin-bottom: 25px;

        }


        .filter-box label {

            font-weight: bold;

            margin-right: 10px;

        }


        .filter-box select {

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            min-width: 200px;

        }


        /* =========================
           ORDERS CONTAINER
        ========================= */

        .orders-container {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        .orders-container h2 {

            margin-top: 0;

        }


        /* =========================
           ORDER CARD
        ========================= */

        .order-card {

            background: #fff8fa;

            border: 1px solid #f0dfe5;

            border-radius: 10px;

            padding: 20px;

            margin-top: 15px;

        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        .order-id {

            font-weight: bold;

            font-size: 17px;

        }


        .order-date {

            font-size: 13px;

            color: #6d5550;

            margin-top: 5px;

        }


        /* =========================
           STATUS
        ========================= */

        .status-badge {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .status-pending {

            background: #fff0b3;

            color: #6b5600;

        }


        .status-processing {

            background: #dceeff;

            color: #24527a;

        }


        .status-shipped {

            background: #e5ddff;

            color: #503c86;

        }


        .status-delivered {

            background: #d9f5df;

            color: #27653a;

        }


        .status-cancelled {

            background: #ffdcdc;

            color: #8a2c2c;

        }


        /* =========================
           CUSTOMER INFO
        ========================= */

        .customer-info {

            margin-top: 18px;

            padding: 15px;

            background: white;

            border-radius: 8px;

        }


        .customer-info p {

            margin: 7px 0;

            word-break: break-word;

        }


        /* =========================
           ORDER ITEMS
        ========================= */

        .order-items {

            margin-top: 15px;

        }


        .order-item {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

            border-bottom: 1px solid #eee;

        }


        .order-item:last-child {

            border-bottom: none;

        }


        /* =========================
           TOTAL
        ========================= */

        .order-total {

            margin-top: 15px;

            padding-top: 15px;

            border-top: 2px solid #eee;

            font-size: 18px;

            font-weight: bold;

            text-align: right;

            color: #d4af37;

        }


        /* =========================
           ACTIONS
        ========================= */

        .order-actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        .order-actions select {

            flex: 1;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 6px;

            background: white;

        }


        .button {

            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

        }


        .brown-button {

            background: #3e2723;

            color: white;

        }


        .brown-button:hover {

            opacity: 0.9;

        }


        /* =========================
           NO ORDERS
        ========================= */

        .no-orders {

            text-align: center;

            padding: 40px;

            color: #6d5550;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: block;

            width: 250px;

            margin: 30px auto;

            padding: 12px;

            background: #3e2723;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 6px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .orders-page {

                padding: 0 15px;

            }


            .admin-header {

                padding: 15px;

            }


            .admin-logo {

                font-size: 19px;

            }


            .order-actions {

                flex-direction: column;

            }


            .filter-box select {

                width: 100%;

                margin-top: 10px;

            }


            .order-item {

                flex-direction: column;

                gap: 5px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">

        <div class="admin-logo">

            Hey Rosella 💎

        </div>


        <div class="admin-badge">

            ADMIN

        </div>

    </header>



    <!-- =========================
         PAGE
    ========================= -->

    <main class="orders-page">


        <div class="page-header">

            <h1>

                📦 Order Management

            </h1>


            <p>

                View and manage customer orders.

            </p>

        </div>



        <!-- =========================
             FILTER
        ========================= -->

        <section class="filter-box">

            <label for="order-filter">

                Filter Orders:

            </label>


            <select
                id="order-filter"
                onchange="filterOrders()"
            >

                <option value="all">

                    All Orders

                </option>


                <option value="pending">

                    Pending

                </option>


                <option value="processing">

                    Processing

                </option>


                <option value="shipped">

                    Shipped

                </option>


                <option value="delivered">

                    Delivered

                </option>


                <option value="cancelled">

                    Cancelled

                </option>

            </select>

        </section>



        <!-- =========================
             ORDERS
        ========================= -->

        <section class="orders-container">

            <h2>

                📋 Customer Orders

            </h2>


            <div id="orders-list">

                <div class="no-orders">

                    ⏳ Loading orders...

                </div>

            </div>

        </section>



        <!-- =========================
             BACK
        ========================= -->

        <a
            href="admin.html"
            class="back-button"
        >

            ← Back to Admin Dashboard

        </a>


    </main>



    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // =====================================================
        // GLOBAL ORDERS ARRAY
        // =====================================================

        let adminOrders = [];



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }



        // =====================================================
        // ESCAPE JAVASCRIPT
        // =====================================================

        function escapeJS(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(/\\/g, "\\\\")

                .replace(/'/g, "\\'")

                .replace(/"/g, '\\"')

                .replace(/\n/g, "\\n")

                .replace(/\r/g, "\\r");

        }



        // =====================================================
        // CHECK ADMIN
        // =====================================================

        async function checkAdminAccess() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session error:",
                    error
                );

                alert(
                    "Could not verify admin session."
                );

                window.location.href =
                    "admin-login.html";

                return false;

            }


            const session =
                data.session;


            if (!session) {

                alert(
                    "Please login as admin first."
                );

                window.location.href =
                    "admin-login.html";

                return false;

            }


            const email =
                session.user.email;


            console.log(
                "Logged in admin:",
                email
            );


            if (
                email !==
                "heyrosella26@gmail.com"
            ) {

                alert(
                    "Access denied. Admin only."
                );

                await supabaseClient.auth.signOut();


                window.location.href =
                    "admin-login.html";


                return false;

            }


            return true;

        }



        // =====================================================
        // LOAD ORDERS FROM SUPABASE
        // =====================================================

        async function loadOrders() {

            const container =
                document.getElementById(
                    "orders-list"
                );


            container.innerHTML = `

                <div class="no-orders">

                    ⏳ Loading orders...

                </div>

            `;


            // CHECK ADMIN

            const isAdmin =
                await checkAdminAccess();


            if (!isAdmin) {

                return;

            }



            // GET ORDERS

            const {
                data,
                error
            } =
                await supabaseClient

                    .from("Hey Rosella")

                    .select(`
                        id,
                        created_at,
                        customer_name,
                        customer_phone,
                        customer_address,
                        payment_method,
                        products,
                        total_amount,
                        order_status,
                        order_number,
                        user_id
                    `)

                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );



            // DATABASE ERROR

            if (error) {

                console.error(
                    "Order fetch error:",
                    error
                );


                container.innerHTML = `

                    <div class="no-orders">

                        ❌ Could not load orders.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

                return;

            }



            console.log(
                "Orders received:",
                data
            );


            adminOrders =
                data || [];


            renderOrders(
                adminOrders
            );

        }



        // =====================================================
        // RENDER ORDERS
        // =====================================================

        function renderOrders(
            orders = adminOrders
        ) {

            const container =
                document.getElementById(
                    "orders-list"
                );


            container.innerHTML = "";



            // NO ORDERS

            if (
                !orders ||
                orders.length === 0
            ) {

                container.innerHTML = `

                    <div class="no-orders">

                        📦 No orders found.

                    </div>

                `;

                return;

            }



            // CREATE CARDS

            orders.forEach(
                function(order) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";



                    // STATUS

                    const status =
                        String(
                            order.order_status ||
                            "pending"
                        ).toLowerCase();


                    const statusClass =
                        status;



                    // DATE

                    const orderDate =
                        order.created_at

                            ? new Date(
                                order.created_at
                            ).toLocaleString(
                                "en-GB"
                            )

                            : "Not available";



                    // PRODUCTS

                    let products = [];


                    try {

                        if (
                            Array.isArray(
                                order.products
                            )
                        ) {

                            products =
                                order.products;

                        }

                        else if (
                            typeof order.products ===
                            "string"
                        ) {

                            products =
                                JSON.parse(
                                    order.products
                                );

                        }

                    }

                    catch (error) {

                        console.error(
                            "Products parse error:",
                            error
                        );

                    }



                    let productsHTML =
                        "";



                    if (
                        products.length === 0
                    ) {

                        productsHTML = `

                            <div class="order-item">

                                <span>

                                    No product information

                                </span>

                            </div>

                        `;

                    }

                    else {

                        productsHTML =

                            products.map(
                                function(item) {


                                    const name =
                                        item.name ||
                                        item.productName ||
                                        "Product";


                                    const quantity =
                                        Number(
                                            item.quantity
                                        ) || 1;


                                    const price =
                                        Number(
                                            item.price
                                        ) || 0;


                                    const subtotal =
                                        price *
                                        quantity;



                                    return `

                                        <div
                                            class="order-item"
                                        >

                                            <span>

                                                ${escapeHTML(
                                                    name
                                                )}

                                                ×

                                                ${quantity}

                                            </span>


                                            <span>

                                                ${subtotal.toLocaleString(
                                                    "en-BD"
                                                )}

                                                BDT

                                            </span>

                                        </div>

                                    `;

                                }
                            ).join("");

                    }



                    // ORDER ID

                    const orderNumber =
                        order.order_number ||
                        order.id ||
                        "N/A";



                    // CUSTOMER

                    const customerName =
                        order.customer_name ||
                        "Not available";


                    const customerPhone =
                        order.customer_phone ||
                        "Not available";


                    const customerAddress =
                        order.customer_address ||
                        "Not available";


                    const paymentMethod =
                        order.payment_method ||
                        "Not specified";



                    // CARD HTML

                    card.innerHTML = `

                        <div class="order-header">


                            <div>

                                <div class="order-id">

                                    Order #

                                    ${escapeHTML(
                                        orderNumber
                                    )}

                                </div>


                                <div class="order-date">

                                    ${escapeHTML(
                                        orderDate
                                    )}

                                </div>

                            </div>



                            <span
                                class="
                                    status-badge
                                    status-${escapeHTML(
                                        statusClass
                                    )}
                                "
                            >

                                ${escapeHTML(
                                    status
                                )}

                            </span>


                        </div>



                        <!-- CUSTOMER INFO -->

                        <div class="customer-info">


                            <p>

                                <strong>

                                    👤 Customer:

                                </strong>


                                ${escapeHTML(
                                    customerName
                                )}

                            </p>



                            <p>

                                <strong>

                                    📞 Phone:

                                </strong>


                                ${escapeHTML(
                                    customerPhone
                                )}

                            </p>



                            <p>

                                <strong>

                                    📍 Address:

                                </strong>


                                ${escapeHTML(
                                    customerAddress
                                )}

                            </p>



                            <p>

                                <strong>

                                    💳 Payment:

                                </strong>


                                ${escapeHTML(
                                    paymentMethod
                                )}

                            </p>



                            <p>

                                <strong>

                                    👤 User ID:

                                </strong>


                                ${escapeHTML(
                                    order.user_id ||
                                    "Not available"
                                )}

                            </p>


                        </div>



                        <!-- PRODUCTS -->

                        <div class="order-items">


                            <strong>

                                🛍️ Ordered Products

                            </strong>


                            ${productsHTML}


                        </div>



                        <!-- TOTAL -->

                        <div class="order-total">

                            Total:


                            ${Number(
                                order.total_amount || 0
                            ).toLocaleString(
                                "en-BD"
                            )}


                            BDT

                        </div>



                        <!-- ACTIONS -->

                        <div class="order-actions">


                            <select
                                onchange="
                                    updateOrderStatus(
                                        '${escapeJS(
                                            order.id
                                        )}',
                                        this.value
                                    )
                                "
                            >


                                <option
                                    value="pending"

                                    ${
                                        status ===
                                        "pending"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Pending

                                </option>



                                <option
                                    value="processing"

                                    ${
                                        status ===
                                        "processing"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Processing

                                </option>



                                <option
                                    value="shipped"

                                    ${
                                        status ===
                                        "shipped"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Shipped

                                </option>



                                <option
                                    value="delivered"

                                    ${
                                        status ===
                                        "delivered"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Delivered

                                </option>



                                <option
                                    value="cancelled"

                                    ${
                                        status ===
                                        "cancelled"
                                            ? "selected"
                                            : ""
                                    }
                                >

                                    Cancelled

                                </option>


                            </select>



                            <button
                                type="button"

                                class="
                                    button
                                    brown-button
                                "

                                onclick="
                                    deleteOrder(
                                        '${escapeJS(
                                            order.id
                                        )}'
                                    )
                                "
                            >

                                🗑️ Delete

                            </button>


                        </div>


                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }



        // =====================================================
        // UPDATE ORDER STATUS
        // =====================================================

        async function updateOrderStatus(
            orderId,
            newStatus
        ) {

            try {


                const {
                    error
                } =

                    await supabaseClient

                        .from("Hey Rosella")

                        .update({

                            order_status:
                                newStatus

                        })

                        .eq(
                            "id",
                            orderId
                        );



                if (error) {

                    console.error(
                        "Status update error:",
                        error
                    );


                    alert(
                        "Could not update order status.\n\n" +
                        error.message
                    );


                    return;

                }



                // UPDATE LOCAL DATA

                const order =
                    adminOrders.find(
                        function(item) {

                            return (
                                item.id ===
                                orderId
                            );

                        }
                    );



                if (order) {

                    order.order_status =
                        newStatus;

                }



                // RE-RENDER

                const selectedFilter =
                    document.getElementById(
                        "order-filter"
                    ).value;


                if (
                    selectedFilter ===
                    "all"
                ) {

                    renderOrders(
                        adminOrders
                    );

                }

                else {

                    filterOrders();

                }



                alert(
                    "✅ Order status updated successfully!"
                );


            }

            catch (error) {

                console.error(
                    "Unexpected status error:",
                    error
                );


                alert(
                    "Something went wrong while updating the order."
                );

            }

        }



        // =====================================================
        // DELETE ORDER
        // =====================================================

        async function deleteOrder(
            orderId
        ) {


            const confirmed =
                confirm(
                    "Are you sure you want to permanently delete this order?"
                );


            if (!confirmed) {

                return;

            }



            try {


                const {
                    error
                } =

                    await supabaseClient

                        .from("Hey Rosella")

                        .delete()

                        .eq(
                            "id",
                            orderId
                        );



                if (error) {

                    console.error(
                        "Delete order error:",
                        error
                    );


                    alert(
                        "Could not delete order.\n\n" +
                        error.message
                    );


                    return;

                }



                // REMOVE FROM LOCAL ARRAY

                adminOrders =
                    adminOrders.filter(
                        function(order) {

                            return (
                                order.id !==
                                orderId
                            );

                        }
                    );



                // RE-RENDER

                filterOrders();



                alert(
                    "🗑️ Order deleted successfully."
                );


            }

            catch (error) {

                console.error(
                    "Unexpected delete error:",
                    error
                );


                alert(
                    "Something went wrong while deleting the order."
                );

            }

        }



        // =====================================================
        // FILTER ORDERS
        // =====================================================

        function filterOrders() {


            const selectedStatus =
                document.getElementById(
                    "order-filter"
                ).value;



            // ALL

            if (
                selectedStatus ===
                "all"
            ) {

                renderOrders(
                    adminOrders
                );

                return;

            }



            // FILTER BY order_status

            const filteredOrders =
                adminOrders.filter(
                    function(order) {

                        return (

                            String(
                                order.order_status ||
                                "pending"
                            ).toLowerCase()

                            ===

                            selectedStatus

                        );

                    }
                );



            renderOrders(
                filteredOrders
            );

        }



        // =====================================================
        // PAGE LOAD
        // =====================================================

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                loadOrders();

            }
        );


    </script>


</body>

</html>

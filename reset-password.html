<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Hey Rosella</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
            font-size: 15px;
        }

        .reset-page {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .reset-box {
            background: rgb(255, 231, 231);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .reset-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .reset-box p {
            text-align: center;
            color: #4b4747;
            margin-bottom: 25px;
        }

        .reset-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .reset-box input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .update-button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .update-button:hover {
            opacity: 0.9;
        }

        .back-button {
            width: 150px;
            display: block;
            text-align: center;
            margin: 30px 0 0 0;
            padding: 7px;
            background: #38221e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="reset-page">

        <div class="reset-box">

            <h1>
                🔐 Reset Password
            </h1>

            <p>
                Enter your new password below.
            </p>


            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
            >


            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
            >


            <button
                type="button"
                class="update-button"
                onclick="updatePassword()"
            >
                Update Password
            </button>


            <p id="message"></p>


            <a
                href="my-account.html"
                class="back-button"
            >
                ← Back to My Account
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

const SUPABASE_URL =
    "https://aktxgvbzmuuatwpimcyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// CHECK RECOVERY SESSION
// =====================================================

async function checkRecoverySession() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    console.log(
        "Recovery session:",
        data.session
    );

    if (error) {

        console.error(
            "Session error:",
            error
        );

        document.getElementById(
            "message"
        ).textContent =
            "Unable to verify password reset link.";

        return false;
    }


    if (!data.session) {

        document.getElementById(
            "message"
        ).style.color =
            "#b00020";

        document.getElementById(
            "message"
        ).textContent =
            "This password reset link is invalid or has expired.";

        document.getElementById(
            "new-password"
        ).disabled = true;

        document.getElementById(
            "confirm-password"
        ).disabled = true;

        document.querySelector(
            ".update-button"
        ).disabled = true;

        return false;
    }


    console.log(
        "Password recovery session is active."
    );

    return true;
}


// =====================================================
// UPDATE PASSWORD
// =====================================================

async function updatePassword() {

    const newPassword =
        document.getElementById(
            "new-password"
        ).value.trim();


    const confirmPassword =
        document.getElementById(
            "confirm-password"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    if (!newPassword || !confirmPassword) {

        message.style.color =
            "#b00020";

        message.textContent =
            "Please fill in both password fields.";

        return;
    }


    if (newPassword.length < 6) {

        message.style.color =
            "#b00020";

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    if (newPassword !== confirmPassword) {

        message.style.color =
            "#b00020";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.style.color =
        "#38221e";

    message.textContent =
        "Updating password...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.updateUser({

            password: newPassword

        });


    if (error) {

        console.error(
            "Password update error:",
            error
        );

        message.style.color =
            "#b00020";

        message.textContent =
            "Could not update password: " +
            error.message;

        return;
    }


    console.log(
        "Password updated:",
        data
    );


    message.style.color =
        "green";

    message.textContent =
        "✅ Password updated successfully!";


    document.getElementById(
        "new-password"
    ).value = "";

    document.getElementById(
        "confirm-password"
    ).value = "";


    await supabaseClient.auth.signOut();


    setTimeout(function() {

        window.location.href =
            "index.html";

    }, 2000);

}


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        console.log(
            "Reset password page loaded."
        );

        await checkRecoverySession();

    }
);

</script>

</body>

</html>

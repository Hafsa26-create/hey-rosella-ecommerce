<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - Hey Rosella</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #facbdb;
            color: #38221e;
        }

        .orders-page {
            max-width: 890px;
            margin: 40px auto;
            padding: 20px;
        }

        .orders-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .orders-header h1 {
            font-size: 27px;
            margin: 0 0 8px;
            color: #3e2723;
        }

        .orders-header p {
            margin: 0;
            color: #474242;
            font-size: 15px;
        }

        .order-card {
            background: rgb(255, 231, 231);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            font-size: 15px;
        }

        .order-card h3 {
            margin: 0 0 15px;
            color: #3e2723;
            font-size: 19px;
        }

        .order-info {
            margin: 8px 0;
            line-height: 1.6;
        }

        .order-status {
            display: inline-block;
            margin-top: 5px;
            padding: 7px 12px;
            background: #fff7f7;
            border-radius: 6px;
            font-weight: bold;
            color: #3e2723;
        }

        .order-details {
            display: none;
            margin-top: 18px;
            padding: 17px;
            background: #fff7f7;
            border-radius: 9px;
            border: 1px solid rgba(62, 39, 35, 0.08);
        }

        .order-details.show {
            display: block;
        }

        .details-button,
        .track-button {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .details-button {
            background: #3e2723;
            color: white;
            border: none;
            margin-right: 8px;
        }

        .track-button {
            background: #d4af37;
            color: white;
            border: none;
        }

        .details-button:hover,
        .track-button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: #3e2723;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back-button:hover {
            opacity: 0.9;
        }

        .loading-message {
            text-align: center;
            padding: 25px;
            color: #474242;
        }

        @media (max-width: 600px) {

            .orders-page {
                margin: 20px auto;
                padding: 15px;
            }

            .orders-header h1 {
                font-size: 23px;
            }

            .order-card {
                padding: 20px;
            }

            .details-button,
            .track-button {
                width: 100%;
                text-align: center;
                margin-right: 0;
                margin-top: 12px;
            }

            .back-button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>

    <div class="orders-page">

        <div class="orders-header">

            <h1>
                📦 My Orders
            </h1>

            <p>
                View your recent orders and track your deliveries.
            </p>

        </div>


        <!-- ORDERS -->

        <div id="orders-container">

            <p class="loading-message">
                Loading your orders...
            </p>

        </div>


        <!-- BACK TO ACCOUNT -->

        <a
            href="my-account.html"
            class="back-button"
        >
            ← Back to My Account
        </a>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // LOAD CUSTOMER ORDERS
        // ==========================================

        async function loadMyOrders() {

            const container =
                document.getElementById(
                    "orders-container"
                );


            // ==========================================
            // GET SESSION
            // ==========================================

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session error:",
                    error
                );

                container.innerHTML = `

                    <div class="order-card">

                        <h3>
                            Could not load your account
                        </h3>

                        <p class="order-info">
                            ${escapeHTML(error.message)}
                        </p>

                    </div>

                `;

                return;
            }


            const session =
                data.session;


            // ==========================================
            // USER NOT LOGGED IN
            // ==========================================

            if (!session) {

                alert(
                    "Please login to view your orders."
                );

                window.location.href =
                    "index.html";

                return;
            }


            const user =
                session.user;


            console.log(
                "Logged in user:",
                user.id
            );


            // ==========================================
            // GET ORDERS
            // ==========================================

            const {
                data: orders,
                error: ordersError
            } =
                await supabaseClient
                    .from("Hey Rosella")
                    .select("*")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            // ==========================================
            // ORDER ERROR
            // ==========================================

            if (ordersError) {

                console.error(
                    "Orders loading error:",
                    ordersError
                );

                container.innerHTML = `

                    <div class="order-card">

                        <h3>
                            Could not load orders
                        </h3>

                        <p class="order-info">
                            ${escapeHTML(
                                ordersError.message
                            )}
                        </p>

                    </div>

                `;

                return;
            }


            // ==========================================
            // NO ORDERS
            // ==========================================

            if (
                !orders ||
                orders.length === 0
            ) {

                container.innerHTML = `

                    <div class="order-card">

                        <h3>
                            No Orders Yet
                        </h3>

                        <p class="order-info">
                            You haven't placed any orders yet.
                        </p>

                        <a
                            href="index.html#shop"
                            class="track-button"
                        >
                            🛍️ Start Shopping
                        </a>

                    </div>

                `;

                return;
            }


            // ==========================================
            // CLEAR LOADING
            // ==========================================

            container.innerHTML = "";


            // ==========================================
            // COLLECT PRODUCT IDS
            // ==========================================

            const productIds = [];


            orders.forEach(function(order) {

                if (
                    !Array.isArray(order.products)
                ) {
                    return;
                }


                order.products.forEach(
                    function(product) {

                        const productId =
                            Number(product.id);


                        if (
                            Number.isInteger(
                                productId
                            ) &&
                            productId > 0 &&
                            !productIds.includes(
                                productId
                            )
                        ) {

                            productIds.push(
                                productId
                            );

                        }

                    }
                );

            });


            // ==========================================
            // LOAD CURRENT PRODUCT DATA
            // ==========================================

            const productMap =
                new Map();


            if (
                productIds.length > 0
            ) {

                const {
                    data: productData,
                    error: productError
                } =
                    await supabaseClient
                        .from("products")
                        .select(
                            "id,name,price,image_url"
                        )
                        .in(
                            "id",
                            productIds
                        );


                if (productError) {

                    console.error(
                        "Product details loading error:",
                        productError
                    );

                } else if (productData) {

                    productData.forEach(
                        function(product) {

                            productMap.set(
                                Number(product.id),
                                product
                            );

                        }
                    );

                }

            }


            // ==========================================
            // SHOW EACH ORDER
            // ==========================================

            orders.forEach(
                function(order) {

                    let productsHTML =
                        "";


                    // ==========================================
                    // PRODUCTS
                    // ==========================================

                    if (
                        Array.isArray(
                            order.products
                        )
                    ) {

                        order.products.forEach(
                            function(product) {

                                const productId =
                                    Number(
                                        product.id
                                    );


                                const currentProduct =
                                    productMap.get(
                                        productId
                                    );


                                const productName =
                                    currentProduct?.name ||
                                    product.name ||
                                    `Product #${
                                        productId ||
                                        "Unknown"
                                    }`;


                                const productPrice =
                                    currentProduct?.price ??
                                    product.price ??
                                    0;


                                const productQuantity =
                                    Number(
                                        product.quantity
                                    ) || 1;


                                productsHTML += `

                                    <div class="order-info">

                                        ${escapeHTML(
                                            productName
                                        )}

                                        ×

                                        ${escapeHTML(
                                            productQuantity
                                        )}

                                        -

                                        ${escapeHTML(
                                            productPrice
                                        )}
                                        BDT

                                    </div>

                                `;

                            }
                        );

                    }


                    // ==========================================
                    // DATE
                    // ==========================================

                    const orderDate =
                        order.created_at
                            ? new Date(
                                order.created_at
                            ).toLocaleDateString()
                            : "N/A";


                    // ==========================================
                    // ORDER CARD
                    // ==========================================

                    const orderCard =
                        document.createElement(
                            "div"
                        );


                    orderCard.className =
                        "order-card";


                    orderCard.innerHTML = `

                        <h3>
                            Order #${escapeHTML(
                                order.order_number
                            )}
                        </h3>


                        <div class="order-status">

                            Status:
                            ${escapeHTML(
                                order.order_status
                            )}

                        </div>


                        <!-- HIDDEN DETAILS -->

                        <div class="order-details">

                            <div class="order-info">

                                <strong>
                                    Date:
                                </strong>

                                ${escapeHTML(
                                    orderDate
                                )}

                            </div>


                            <div class="order-info">

                                <strong>
                                    Products:
                                </strong>

                            </div>


                            ${productsHTML}


                            <div class="order-info">

                                <strong>
                                    Total:
                                </strong>

                                ${escapeHTML(
                                    order.total_amount
                                )}
                                BDT

                            </div>


                            <div class="order-info">

                                <strong>
                                    Payment:
                                </strong>

                                ${escapeHTML(
                                    order.payment_method
                                )}

                            </div>


                            <div class="order-info">

                                <strong>
                                    Customer:
                                </strong>

                                ${escapeHTML(
                                    order.customer_name
                                )}

                            </div>


                            <div class="order-info">

                                <strong>
                                    Phone:
                                </strong>

                                ${escapeHTML(
                                    order.customer_phone
                                )}

                            </div>


                            <div class="order-info">

                                <strong>
                                    Address:
                                </strong>

                                ${escapeHTML(
                                    order.customer_address
                                )}

                            </div>

                        </div>


                        <!-- VIEW DETAILS -->

                        <button
                            type="button"
                            class="details-button"
                            onclick="toggleOrderDetails(this)"
                        >
                            📋 View Details
                        </button>


                        <!-- TRACK ORDER -->

                        <a
                            href="order-tracking.html?order=${encodeURIComponent(
                                order.order_number
                            )}"
                            class="track-button"
                        >
                            🚚 Track This Order
                        </a>

                    `;


                    container.appendChild(
                        orderCard
                    );

                }
            );

        }


        // ==========================================
        // VIEW / HIDE ORDER DETAILS
        // ==========================================

        function toggleOrderDetails(button) {

            const orderCard =
                button.closest(
                    ".order-card"
                );


            if (!orderCard) {
                return;
            }


            const details =
                orderCard.querySelector(
                    ".order-details"
                );


            if (!details) {
                return;
            }


            details.classList.toggle(
                "show"
            );


            if (
                details.classList.contains(
                    "show"
                )
            ) {

                button.textContent =
                    "📋 Hide Details";

            } else {

                button.textContent =
                    "📋 View Details";

            }

        }


        // ==========================================
        // START
        // ==========================================

        loadMyOrders();

    </script>

</body>

</html>

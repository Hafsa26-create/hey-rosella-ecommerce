<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Products - Hey Rosella</title>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         SUPABASE CONNECTION
    ====================================================== -->

    <script>

        const SUPABASE_URL =
            "https://aktxgvbzmuuatwpimcyz.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_7I4I_QN6C2yyiSjghG9L9Q_FyNBCwVQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fff0f5;

            color: #3e2723;

        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            background: #3e2723;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .admin-logo {

            font-size: 24px;

            font-weight: bold;

        }


        .admin-badge {

            background: #d4af37;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        /* =========================
           PAGE
        ========================= */

        .products-page {

            max-width: 1100px;

            margin: 40px auto;

            padding: 0 25px;

        }


        .page-header {

            margin-bottom: 25px;

        }


        .page-header h1 {

            margin-bottom: 8px;

        }


        .page-header p {

            color: #6d5550;

        }


        /* =========================
           FORM
        ========================= */

        .product-form {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;

        }


        .product-form h2 {

            margin-top: 0;

        }


        .form-group {

            margin-top: 15px;

        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;

        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 14px;

        }


        .form-group textarea {

            min-height: 90px;

            resize: vertical;

        }


        /* =========================
           BUTTONS
        ========================= */

        .button {

            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

        }


        .button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .gold-button {

            background: #d4af37;

            color: white;

        }


        .brown-button {

            background: #3e2723;

            color: white;

        }


        .gray-button {

            background: #eee;

            color: #3e2723;

        }


        .form-button {

            width: 100%;

            margin-top: 20px;

        }


        /* =========================
           PRODUCTS SECTION
        ========================= */

        .products-section {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);

        }


        .products-section h2 {

            margin-top: 0;

        }


        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 20px;

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .admin-product-card {

            background: #fff8fa;

            border: 1px solid #f0dfe5;

            border-radius: 10px;

            padding: 15px;

        }


        .product-image {

            height: 180px;

            background: white;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

            margin-bottom: 15px;

            overflow: hidden;

        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .admin-product-card h3 {

            margin: 5px 0;

        }


        .product-price {

            font-weight: bold;

            color: #d4af37;

            margin-bottom: 5px;

        }


        .product-category {

            font-size: 13px;

            color: #6d5550;

            margin-bottom: 15px;

        }


        .product-description {

            font-size: 13px;

            color: #6d5550;

            min-height: 40px;

            margin-bottom: 15px;

        }


        .product-actions {

            display: flex;

            gap: 8px;

        }


        .product-actions button {

            flex: 1;

        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            grid-column: 1 / -1;

            text-align: center;

            padding: 30px;

            color: #6d5550;

        }


        .error-message {

            color: #b00020;

        }


        /* =========================
           BACK
        ========================= */

        .back-button {

            display: block;

            width: 250px;

            margin: 30px auto;

            padding: 12px;

            background: #3e2723;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 6px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .products-grid {

                grid-template-columns:
                    1fr 1fr;

            }

        }


        @media (max-width: 550px) {

            .admin-header {

                padding: 15px;

            }


            .admin-logo {

                font-size: 19px;

            }


            .products-page {

                padding: 0 15px;

            }


            .products-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="admin-header">

        <div class="admin-logo">

            Hey Rosella 💎

        </div>


        <div class="admin-badge">

            ADMIN

        </div>

    </header>



    <!-- =====================================================
         MAIN PAGE
    ====================================================== -->

    <main class="products-page">


        <div class="page-header">

            <h1>

                🛍️ Product Management

            </h1>


            <p>

                Add and manage your Hey Rosella products.

            </p>

        </div>



        <!-- =====================================================
             ADD PRODUCT FORM
        ====================================================== -->

        <section class="product-form">

            <h2>

                ➕ Add New Product

            </h2>


            <div class="form-group">

                <label for="product-name">

                    Product Name

                </label>


                <input
                    type="text"
                    id="product-name"
                    placeholder="Example: Pearl Necklace"
                >

            </div>



            <div class="form-group">

                <label for="product-price">

                    Price (BDT)

                </label>


                <input
                    type="number"
                    id="product-price"
                    placeholder="850"
                    min="0"
                >

            </div>



            <div class="form-group">

                <label for="product-category">

                    Category

                </label>


                <select id="product-category">

                    <option value="">

                        Select Category

                    </option>


                    <option value="Earrings">

                        Earrings

                    </option>


                    <option value="Jhumka">

                        Jhumka

                    </option>


                    <option value="Chhoto Jhumka">

                        Chhoto Jhumka

                    </option>


                    <option value="Kashmiri Jhumka">

                        Kashmiri Jhumka

                    </option>


                    <option value="Pendant">

                        Pendant

                    </option>


                    <option value="Rings">

                        Rings

                    </option>


                    <option value="Necklace">

                        Necklace

                    </option>


                    <option value="Bracelet">

                        Bracelet

                    </option>

                </select>

            </div>



            <div class="form-group">

                <label for="product-description">

                    Product Description

                </label>


                <textarea
                    id="product-description"
                    placeholder="Write a short product description..."
                ></textarea>

            </div>



            <div class="form-group">

                <label for="product-image-url">

                    Product Image URL

                </label>


                <input
                    type="url"
                    id="product-image-url"
                    placeholder="https://example.com/image.jpg"
                >

            </div>



            <button
                type="button"
                id="submit-product-button"
                class="button gold-button form-button"
                onclick="saveProduct()"
            >

                ➕ Add Product

            </button>

        </section>



        <!-- =====================================================
             PRODUCT LIST
        ====================================================== -->

        <section class="products-section">

            <h2>

                📋 Current Products

            </h2>


            <div
                id="admin-products-grid"
                class="products-grid"
            ></div>

        </section>



        <!-- =====================================================
             BACK
        ====================================================== -->

        <a
            href="admin.html"
            class="back-button"
        >

            ← Back to Admin Dashboard

        </a>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        // =====================================================
        // EDITING PRODUCT ID
        // =====================================================

        let editingProductId = null;



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(value) {

            return String(value ?? "")

                .replaceAll("&", "&amp;")

                .replaceAll("<", "&lt;")

                .replaceAll(">", "&gt;")

                .replaceAll('"', "&quot;")

                .replaceAll("'", "&#039;");

        }



        // =====================================================
        // LOAD PRODUCTS FROM SUPABASE
        // =====================================================

        async function loadProducts() {

            const container =
                document.getElementById(
                    "admin-products-grid"
                );


            container.innerHTML = `

                <div class="message">

                    Loading products...

                </div>

            `;


            const {
                data,
                error
            } = await supabaseClient

                .from("products")

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Product loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="message error-message">

                        ❌ Failed to load products.<br><br>

                        ${escapeHtml(error.message)}

                    </div>

                `;


                return;

            }


            renderProducts(
                data || []
            );

        }



        // =====================================================
        // RENDER PRODUCTS
        // =====================================================

        function renderProducts(products) {

            const container =
                document.getElementById(
                    "admin-products-grid"
                );


            container.innerHTML = "";


            if (!products.length) {

                container.innerHTML = `

                    <div class="message">

                        No products added yet.

                    </div>

                `;


                return;

            }


            products.forEach(
                product => {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "admin-product-card";


                    let imageContent = `

                        Jewellery Image

                    `;


                    if (product.image_url) {

                        imageContent = `

                            <img
                                src="${escapeHtml(product.image_url)}"
                                alt="${escapeHtml(product.name)}"
                                onerror="this.parentElement.innerHTML='Jewellery Image';"
                            >

                        `;

                    }


                    card.innerHTML = `

                        <div class="product-image">

                            ${imageContent}

                        </div>


                        <h3>

                            ${escapeHtml(product.name)}

                        </h3>


                        <div class="product-price">

                            ${Number(
                                product.price || 0
                            ).toLocaleString()} BDT

                        </div>


                        <div class="product-category">

                            ${escapeHtml(
                                product.category || ""
                            )}

                        </div>


                        <div class="product-description">

                            ${escapeHtml(
                                product.description || ""
                            )}

                        </div>


                        <div class="product-actions">


                            <button
                                type="button"
                                class="button brown-button"
                                onclick="editProduct('${product.id}')"
                            >

                                ✏️ Edit

                            </button>


                            <button
                                type="button"
                                class="button gray-button"
                                onclick="deleteProduct('${product.id}')"
                            >

                                🗑️ Delete

                            </button>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }



        // =====================================================
        // ADD / UPDATE PRODUCT
        // =====================================================

        async function saveProduct() {

            const name =
                document
                    .getElementById(
                        "product-name"
                    )
                    .value
                    .trim();


            const price =
                document
                    .getElementById(
                        "product-price"
                    )
                    .value;


            const category =
                document
                    .getElementById(
                        "product-category"
                    )
                    .value;


            const description =
                document
                    .getElementById(
                        "product-description"
                    )
                    .value
                    .trim();


            const imageUrl =
                document
                    .getElementById(
                        "product-image-url"
                    )
                    .value
                    .trim();


            if (
                !name ||
                !price ||
                !category
            ) {

                alert(
                    "Please enter product name, price and category."
                );


                return;

            }


            const button =
                document.getElementById(
                    "submit-product-button"
                );


            button.disabled = true;


            button.textContent =
                editingProductId
                    ? "Updating..."
                    : "Adding...";


            let result;


            // =================================================
            // UPDATE
            // =================================================

            if (editingProductId) {

                result =
                    await supabaseClient

                        .from("products")

                        .update({

                            name:
                                name,

                            price:
                                Number(price),

                            category:
                                category,

                            description:
                                description,

                            image_url:
                                imageUrl || null,

                            updated_at:
                                new Date().toISOString()

                        })

                        .eq(
                            "id",
                            editingProductId
                        );

            }


            // =================================================
            // INSERT
            // =================================================

            else {

                result =
                    await supabaseClient

                        .from("products")

                        .insert({

                            name:
                                name,

                            price:
                                Number(price),

                            category:
                                category,

                            description:
                                description,

                            image_url:
                                imageUrl || null

                        });

            }


            button.disabled = false;


            if (result.error) {

                console.error(
                    "Product save error:",
                    result.error
                );


                alert(
                    "❌ Product save failed:\n\n" +
                    result.error.message
                );


                button.textContent =
                    editingProductId
                        ? "✏️ Update Product"
                        : "➕ Add Product";


                return;

            }


            alert(

                editingProductId

                    ? "✅ Product updated successfully!"

                    : "❤️ Product added successfully!"

            );


            clearForm();


            await loadProducts();

        }



        // =====================================================
        // EDIT PRODUCT
        // =====================================================

        async function editProduct(productId) {

            const {
                data,
                error
            } = await supabaseClient

                .from("products")

                .select("*")

                .eq(
                    "id",
                    productId
                )

                .single();


            if (error || !data) {

                console.error(
                    "Edit product error:",
                    error
                );


                alert(
                    "❌ Unable to load product."
                );


                return;

            }


            document.getElementById(
                "product-name"
            ).value =
                data.name || "";


            document.getElementById(
                "product-price"
            ).value =
                data.price || "";


            document.getElementById(
                "product-category"
            ).value =
                data.category || "";


            document.getElementById(
                "product-description"
            ).value =
                data.description || "";


            document.getElementById(
                "product-image-url"
            ).value =
                data.image_url || "";


            editingProductId =
                data.id;


            document.getElementById(
                "submit-product-button"
            ).textContent =
                "✏️ Update Product";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        // =====================================================
        // DELETE PRODUCT
        // =====================================================

        async function deleteProduct(productId) {

            const {
                data: product,
                error: fetchError
            } = await supabaseClient

                .from("products")

                .select("name")

                .eq(
                    "id",
                    productId
                )

                .single();


            if (
                fetchError ||
                !product
            ) {

                console.error(
                    "Delete fetch error:",
                    fetchError
                );


                alert(
                    "❌ Unable to find this product."
                );


                return;

            }


            const confirmed =
                confirm(

                    `Are you sure you want to delete "${product.name}"?`

                );


            if (!confirmed) {

                return;

            }


            const {
                error
            } = await supabaseClient

                .from("products")

                .delete()

                .eq(
                    "id",
                    productId
                );


            if (error) {

                console.error(
                    "Delete product error:",
                    error
                );


                alert(
                    "❌ Product deletion failed:\n\n" +
                    error.message
                );


                return;

            }


            alert(
                "🗑️ Product deleted successfully."
            );


            await loadProducts();

        }



        // =====================================================
        // CLEAR FORM
        // =====================================================

        function clearForm() {

            document.getElementById(
                "product-name"
            ).value = "";


            document.getElementById(
                "product-price"
            ).value = "";


            document.getElementById(
                "product-category"
            ).value = "";


            document.getElementById(
                "product-description"
            ).value = "";


            document.getElementById(
                "product-image-url"
            ).value = "";


            editingProductId =
                null;


            document.getElementById(
                "submit-product-button"
            ).textContent =
                "➕ Add Product";

        }



        // =====================================================
        // PAGE LOAD
        // =====================================================

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                loadProducts();

            }
        );


    </script>

</body>

</html>

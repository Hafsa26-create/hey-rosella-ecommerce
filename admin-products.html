<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Products - Hey Rosella</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff0f5;color:#3e2723}.admin-header{background:#3e2723;color:white;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.admin-logo{font-size:24px;font-weight:bold}.admin-badge{background:#d4af37;padding:7px 12px;border-radius:20px;font-size:13px}.products-page{max-width:1100px;margin:40px auto;padding:0 25px}.page-header{margin-bottom:25px}.page-header h1{margin-bottom:8px}.page-header p{color:#6d5550}.product-form,.products-section{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}.product-form{margin-bottom:30px}.product-form h2,.products-section h2{margin-top:0}.form-group{margin-top:15px}.form-group label{display:block;margin-bottom:6px;font-weight:bold}.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;font-size:14px}.form-group textarea{min-height:90px;resize:vertical}.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:15px}.checkbox-row input{width:auto}.image-preview{display:none;width:120px;height:120px;object-fit:cover;border-radius:8px;margin-top:10px;border:1px solid #f0dfe5}.button{padding:11px 18px;border:0;border-radius:6px;cursor:pointer;font-size:14px}.button:disabled{opacity:.6;cursor:not-allowed}.gold-button{background:#d4af37;color:white}.brown-button{background:#3e2723;color:white}.gray-button{background:#eee;color:#3e2723}.form-actions{display:flex;gap:10px;margin-top:20px}.form-actions .button{flex:1}.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.admin-product-card{background:#fff8fa;border:1px solid #f0dfe5;border-radius:10px;padding:15px}.product-image{height:180px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;margin-bottom:15px;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover}.admin-product-card h3{margin:5px 0}.product-price{font-weight:bold;color:#d4af37;margin-bottom:5px}.product-category{font-size:13px;color:#6d5550;margin-bottom:8px}.product-description{font-size:13px;color:#6d5550;line-height:1.5;min-height:39px;margin-bottom:12px}.status-badge{display:inline-block;padding:4px 8px;border-radius:15px;font-size:11px;margin-bottom:12px;background:#dff3df;color:#286b2b}.status-badge.inactive{background:#eee;color:#666}.product-actions{display:flex;gap:8px}.product-actions button{flex:1}.message{display:none;padding:11px 14px;margin-top:15px;border-radius:7px;font-size:14px}.message.success{display:block;background:#e4f6e4;color:#286b2b}.message.error{display:block;background:#ffe5e5;color:#a12626}.loading{text-align:center;padding:30px;color:#6d5550}.empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;color:#6d5550}.back-button{display:block;width:250px;margin:30px auto;padding:12px;background:#3e2723;color:white;text-align:center;text-decoration:none;border-radius:6px}@media(max-width:800px){.products-grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.admin-header{padding:15px}.admin-logo{font-size:19px}.products-page{padding:0 15px}.products-grid{grid-template-columns:1fr}.form-actions{flex-direction:column}}</style></head><body><header class="admin-header"><div class="admin-logo">Hey Rosella 💎</div><div class="admin-badge">ADMIN</div></header><main class="products-page"><div class="page-header"><h1>🛍️ Product Management</h1><p>Add and manage your Hey Rosella products.</p></div><section class="product-form"><h2 id="form-title">➕ Add New Product</h2><div class="form-group"><label for="product-name">Product Name</label><input id="product-name" type="text" placeholder="Example: Pearl Necklace"></div><div class="form-group"><label for="product-price">Price (BDT)</label><input id="product-price" type="number" min="0" step="0.01" placeholder="850"></div><div class="form-group"><label for="product-category">Category</label><select id="product-category"><option value="">Select Category</option><option>Earrings</option><option>Jhumka</option><option>Chhoto Jhumka</option><option>Kashmiri Jhumka</option><option>Pendant</option><option>Rings</option><option>Necklace</option><option>Bracelet</option></select></div><div class="form-group"><label for="product-description">Product Description</label><textarea id="product-description" placeholder="Write a short product description..."></textarea></div><div class="form-group"><label for="product-image">Product Image</label><input id="product-image" type="file" accept="image/*"><img id="image-preview" class="image-preview" alt="Image preview"></div><div class="checkbox-row"><input id="product-active" type="checkbox" checked><label for="product-active">Show this product on website</label></div><div id="form-message" class="message"></div><div class="form-actions"><button id="save-product-button" class="button gold-button" onclick="saveProduct()">➕ Add Product</button><button id="cancel-edit-button" class="button gray-button" onclick="cancelEdit()" style="display:none">Cancel Edit</button></div></section><section class="products-section"><h2>📋 Current Products</h2><div id="admin-products-grid" class="products-grid"><div class="loading">Loading products...</div></div></section><a href="admin.html" class="back-button">← Back to Admin Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://aktxgvbzmuuatwpimcyz.supabase.co",SUPABASE_KEY="sb_publishable_7L4I_QN6C2yyiSjihG9L9Q_FyNBCwVQ",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),ADMIN_EMAIL="heyrosella26@gmail.com",BUCKET="product-images";let editingProductId=null,oldImageUrl=null,productsCache=[];const $=id=>document.getElementById(id);function msg(t,type="success"){const e=$("form-message");e.textContent=t;e.className="message "+type}function clearMsg(){const e=$("form-message");e.textContent="";e.className="message"}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function pathFromUrl(url){const m=`/storage/v1/object/public/${BUCKET}/`;const i=(url||"").indexOf(m);return i<0?null:decodeURIComponent(url.slice(i+m.length))}async function auth(){const{data,error}=await supabaseClient.auth.getSession();if(error||!data.session){location.href="admin-login.html";return false}if((data.session.user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await supabaseClient.auth.signOut();alert("Access denied. Admin account only.");location.href="admin-login.html";return false}return true}$("product-image").addEventListener("change",e=>{const f=e.target.files[0],p=$("image-preview");if(!f){p.style.display="none";return}if(!f.type.startsWith("image/")||f.size>5*1024*1024){msg("Please select an image up to 5MB.","error");e.target.value="";p.style.display="none";return}p.src=URL.createObjectURL(f);p.style.display="block";clearMsg()});async function uploadImage(file){if(!file)return null;const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"")||"jpg",path=`products/${Date.now()}-${crypto.randomUUID()}.${ext}`;const{error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(error)throw Error("Image upload failed: "+error.message);const{data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);return{path,url:data.publicUrl}}async function removeImage(url){const p=pathFromUrl(url);if(p)await supabaseClient.storage.from(BUCKET).remove([p])}async function loadProducts(){const g=$("admin-products-grid");g.innerHTML='<div class="loading">Loading products...</div>';const{data,error}=await supabaseClient.from("products").select("*").order("created_at",{ascending:false});if(error){console.error(error);g.innerHTML=`<div class="empty-state">❌ Failed to load products.<br><small>${esc(error.message)}</small></div>`;return}productsCache=data||[];render(productsCache)}function render(ps){const g=$("admin-products-grid");if(!ps.length){g.innerHTML='<div class="empty-state">🛍️ No products found.<br>Add your first product above.</div>';return}g.innerHTML=ps.map(p=>{const image=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:"🖼️ No Image",active=p.is_active!==false?'<span class="status-badge">Active</span>':'<span class="status-badge inactive">Inactive</span>';return `<article class="admin-product-card"><div class="product-image">${image}</div><h3>${esc(p.name)}</h3><div class="product-price">৳${Number(p.price||0).toLocaleString("en-BD")}</div><div class="product-category">Category: ${esc(p.category)}</div><div class="product-description">${esc(p.description||"No description added.")}</div>${active}<div class="product-actions"><button class="button brown-button" onclick="editAdminProduct('${esc(p.id)}')">✏️ Edit</button><button class="button gray-button" onclick="deleteAdminProduct('${esc(p.id)}')">🗑️ Delete</button></div></article>`}).join("")}function resetForm(hide=true){editingProductId=null;oldImageUrl=null;$("product-name").value="";$("product-price").value="";$("product-category").value="";$("product-description").value="";$("product-active").checked=true;$("product-image").value="";$("image-preview").style.display="none";$("image-preview").removeAttribute("src");$("form-title").textContent="➕ Add New Product";$("save-product-button").textContent="➕ Add Product";$("cancel-edit-button").style.display="none";if(hide)clearMsg()}function cancelEdit(){resetForm()}async function saveProduct(){clearMsg();const name=$("product-name").value.trim(),price=$("product-price").value,category=$("product-category").value,description=$("product-description").value.trim(),active=$("product-active").checked,file=$("product-image").files[0]||null;if(!name||!price||!category)return msg("Please enter product name, price and category.","error");const b=$("save-product-button");b.disabled=true;b.textContent="⏳ Saving...";let uploaded=null;try{if(file){msg("Uploading product image...");uploaded=await uploadImage(file)}if(editingProductId!==null){const update={name,price:Number(price),category,description,is_active:active};if(uploaded)update.image_url=uploaded.url;const{error}=await supabaseClient.from("products").update(update).eq("id",editingProductId);if(error){if(uploaded)await supabaseClient.storage.from(BUCKET).remove([uploaded.path]);throw Error("Product update failed: "+error.message)}if(uploaded&&oldImageUrl)await removeImage(oldImageUrl);msg("✅ Product updated successfully!");}else{const{error}=await supabaseClient.from("products").insert([{name,price:Number(price),category,description,image_url:uploaded?.url||null,is_active:active}]);if(error){if(uploaded)await supabaseClient.storage.from(BUCKET).remove([uploaded.path]);throw Error("Product save failed: "+error.message)}msg("❤️ Product added successfully!")}resetForm(false);await loadProducts()}catch(e){console.error(e);msg("❌ "+e.message,"error")}finally{b.disabled=false;if(editingProductId===null)b.textContent="➕ Add Product"}}function editAdminProduct(id){const p=productsCache.find(x=>String(x.id)===String(id));if(!p)return msg("Product not found.","error");editingProductId=p.id;oldImageUrl=p.image_url||null;$("product-name").value=p.name||"";$("product-price").value=p.price??"";$("product-category").value=p.category||"";$("product-description").value=p.description||"";$("product-active").checked=p.is_active!==false;$("product-image").value="";const pr=$("image-preview");if(p.image_url){pr.src=p.image_url;pr.style.display="block"}else pr.style.display="none";$("form-title").textContent="✏️ Edit Product";$("save-product-button").textContent="💾 Update Product";$("cancel-edit-button").style.display="block";clearMsg();scrollTo({top:0,behavior:"smooth"})}async function deleteAdminProduct(id){const p=productsCache.find(x=>String(x.id)===String(id));if(!p)return;if(!confirm(`Delete "${p.name}"? This cannot be undone.`))return;try{const{error}=await supabaseClient.from("products").delete().eq("id",p.id);if(error)throw Error("Product delete failed: "+error.message);if(p.image_url)await removeImage(p.image_url);if(String(editingProductId)===String(p.id))resetForm();msg("🗑️ Product deleted successfully!");await loadProducts()}catch(e){console.error(e);msg("❌ "+e.message,"error")}}(async()=>{if(await auth())await loadProducts()})();</script></body></html>
